<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 語音與相機翻譯機</title>
    <!-- 引入前端免費 OCR 引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        /* 保留你原本喜愛的精美 UI 樣式 */
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            max-width: 500px;
            width: 100%;
            background: var(--card);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }
        h1 {
            font-size: 22px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            color: var(--primary);
        }
        .card-section {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }
        select, input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 16px;
            background: var(--card);
            box-sizing: border-box;
        }
        .grid-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        button {
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-main {
            background: var(--primary);
            color: white;
        }
        .btn-main:hover {
            background: var(--primary-hover);
        }
        .btn-replay {
            background: #10b981;
            color: white;
            width: 100%;
            margin-top: 8px;
        }
        .btn-replay:hover {
            background: #059669;
        }
        /* 即時日誌監控與結果視窗樣式 */
        .log-box {
            background: #0f172a;
            color: #38bdf8;
            font-family: monospace;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            min-height: 40px;
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }
        .result-title {
            font-size: 13px;
            color: #64748b;
            margin-top: 8px;
            margin-bottom: 2px;
        }
        .display-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            min-height: 44px;
            font-size: 16px;
            word-break: break-all;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🌐 AI 雙向語音與相機翻譯</h1>

    <!-- 1. 語言選擇選單 -->
    <div class="card-section">
        <label for="langSelect">請選擇目標語系：</label>
        <select id="langSelect">
            <!-- 由後端動態載入 -->
        </select>
    </div>

    <!-- 2. 🎤 語音雙向翻譯區 -->
    <div class="card-section">
        <label>🎤 語音雙向對話</label>
        <div class="grid-btns">
            <button class="btn-main" id="btnMe">🗣️ 我說中文</button>
            <button class="btn-main" id="btnOther" style="background:#0284c7;">🎧 對方說外語</button>
        </div>
        
        <div class="result-title">即時狀態監控日誌：</div>
        <div id="voiceLog" class="log-box">準備就緒</div>

        <div class="result-title">辨識原文：</div>
        <div id="voiceOriginal" class="display-box"></div>

        <div class="result-title">翻譯結果：</div>
        <div id="voiceTranslated" class="display-box" style="font-weight: bold; color: #1e1b4b;"></div>
        
        <!-- 🔊 重新播放按鈕 -->
        <button class="btn-replay" id="btnReplayVoice">🔊 重新播放語音</button>
    </div>

    <!-- 3. 📸 相機拍照與圖片翻譯區 -->
    <div class="card-section">
        <label>📸 相機拍照 / 圖片翻譯</label>
        <input type="file" id="imageInput" accept="image/*" capture="environment">

        <div class="result-title">OCR 狀態日誌：</div>
        <div id="ocrLog" class="log-box">等待上傳圖片...</div>

        <div class="result-title">圖片辨識原文：</div>
        <div id="ocrOriginal" class="display-box"></div>

        <div class="result-title">圖片翻譯結果：</div>
        <div id="ocrTranslated" class="display-box" style="font-weight: bold; color: #1e1b4b;"></div>
        
        <!-- 🔊 OCR 重新播放按鈕 -->
        <button class="btn-replay" id="btnReplayOcr" style="background: #8b5cf6;">🔊 重新播放翻譯</button>
    </div>
</div>

<script>
    let languagesConfig = [];
    let recognition = null;
    let lastVoiceText = "";      // 記錄最後一次語音翻譯結果用於重播
    let lastVoiceVoiceCode = ""; // 記錄最後一次語音播放語系
    let lastOcrText = "";        // 記錄最後一次 OCR 翻譯結果用於重播

    // 頁面初始化：載入選單與語音引擎
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/languages');
            languagesConfig = await res.json();
            
            const select = document.getElementById('langSelect');
            select.innerHTML = '';
            languagesConfig.forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang.name;
                opt.innerText = lang.label || lang.name;
                select.appendChild(opt);
            });
        } catch (err) {
            document.getElementById('voiceLog').innerText = "預設語系選單載入失敗";
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
        } else {
            document.getElementById('voiceLog').innerText = "提示：此瀏覽器不支援 Speech API，請用 Safari/Chrome";
        }
    });

    function getSelectedLangObj() {
        const name = document.getElementById('langSelect').value;
        return languagesConfig.find(l => l.name === name) || { name: "英文", code: "en", voice: "en-US" };
    }

    // 🔊 核心語音播放函式 (TTS)
    function speakText(text, langCode) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel(); // 停止上一段
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langCode;
        window.speechSynthesis.speak(utterance);
    }

    // 🎤 語音翻譯邏輯
    function startVoiceTranslation(mode) {
        if (!recognition) return;
        const targetLang = getSelectedLangObj();
        const logBox = document.getElementById('voiceLog');
        const originalBox = document.getElementById('voiceOriginal');
        const translatedBox = document.getElementById('voiceTranslated');

        if (mode === 'me') {
            recognition.lang = 'zh-TW';
            logBox.innerText = "[系統] 請開始說中文...";
        } else {
            recognition.lang = targetLang.voice || 'en-US';
            logBox.innerText = `[系統] 請開始說 ${targetLang.name}...`;
        }

        recognition.start();

        recognition.onresult = async (event) => {
            const resultText = event.results[0][0].transcript;
            originalBox.innerText = resultText;
            logBox.innerText = `[辨識成功] 有效文字: "${resultText}"\n[系統] 正在發送免費翻譯...`;

            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: resultText, target: targetLang.name, mode: mode })
                });
                const data = await response.json();
                
                if (data.translatedText) {
                    translatedBox.innerText = data.translatedText;
                    logBox.innerText = "[翻譯完成] 成功獲得結果，觸發語音朗讀。";
                    
                    // 紀錄重播資訊並播放
                    lastVoiceText = data.translatedText;
                    lastVoiceVoiceCode = (mode === 'me') ? targetLang.voice : 'zh-TW';
                    speakText(lastVoiceText, lastVoiceVoiceCode);
                } else {
                    logBox.innerText = "[警告] 翻譯回傳空值";
                }
            } catch (err) {
                logBox.innerText = "[錯誤] 請求失敗，請檢查網路。";
            }
        };

        recognition.onerror = (e) => {
            logBox.innerText = `[錯誤] 語音辨識失敗 (${e.error})`;
        };
    }

    // 📸 圖片 OCR 處理區（完美對接舊版 UI）
    document.getElementById('imageInput').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const menuLang = document.getElementById('langSelect').value;
        const ocrLog = document.getElementById('ocrLog');
        const ocrOriginal = document.getElementById('ocrOriginal');
        const ocrTranslated = document.getElementById('ocrTranslated');

        ocrOriginal.innerText = "";
        ocrTranslated.innerText = "";
        ocrLog.innerText = "[OCR] 正在啟動前端辨識引擎...";

        let tesseractLang = 'eng'; 
        if (menuLang === '日文') tesseractLang = 'jpn';
        else if (menuLang === '韓文') tesseractLang = 'kor';
        else if (menuLang === '中文' || menuLang === '繁體中文') tesseractLang = 'chi_tra';
        else if (menuLang === '法文') tesseractLang = 'fra';
        else if (menuLang === '德文') tesseractLang = 'deu';
        else if (menuLang === '西班牙文') tesseractLang = 'spa';

        try {
            const result = await Tesseract.recognize(file, tesseractLang, {
                logger: m => {
                    if (m.status === 'recognizing') {
                        ocrLog.innerText = `[辨識中] 進度：${Math.floor(m.progress * 100)}%`;
                    }
                }
            });
            
            const detectedText = result.data.text ? result.data.text.trim() : "";

            if (!detectedText) {
                ocrLog.innerText = "[OCR 結束] 未能在圖中找到清晰文字。";
                ocrOriginal.innerText = "未能辨識出文字";
                return;
            }

            ocrOriginal.innerText = detectedText;
            ocrLog.innerText = "[OCR 成功] 正在調用後端進行翻譯...";

            const response = await fetch('/ocr_translate_text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: detectedText, menu_lang: menuLang })
            });

            const data = await response.json();
            
            if (data.ocrTranslated) {
                ocrTranslated.innerText = data.ocrTranslated;
                ocrLog.innerText = "[翻譯完成] 已成功渲染結果。";
                
                // 儲存 OCR 翻譯結果供重播（預設唸繁體中文）
                lastOcrText = data.ocrTranslated;
                speakText(lastOcrText, 'zh-TW');
            } else {
                ocrLog.innerText = "[錯誤] 後端翻譯未成功回傳結果。";
            }

        } catch (error) {
            ocrLog.innerText = `[執行失敗] ${error.message}`;
        } finally {
            document.getElementById('imageInput').value = ""; // 清空欄位
        }
    });

    // 🔘 按鈕事件綁定
    document.getElementById('btnMe').addEventListener('click', () => startVoiceTranslation('me'));
    document.getElementById('btnOther').addEventListener('click', () => startVoiceTranslation('other'));
    
    // 🔊 語音重播
    document.getElementById('btnReplayVoice').addEventListener('click', () => {
        if (lastVoiceText) {
            speakText(lastVoiceText, lastVoiceVoiceCode);
            document.getElementById('voiceLog').innerText = "[系統] 重新播放上次語音結果";
        } else {
            alert("目前沒有可播放的語音紀錄");
        }
    });

    // 🔊 OCR 重播
    document.getElementById('btnReplayOcr').addEventListener('click', () => {
        if (lastOcrText) {
            speakText(lastOcrText, 'zh-TW');
            document.getElementById('ocrLog').innerText = "[系統] 重新播放上次圖片翻譯結果";
        } else {
            alert("目前沒有可播放的圖片翻譯紀錄");
        }
    });
</script>

</body>
</html>
