<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 免費語音與相機翻譯機</title>
    <!-- 引入前端免費 OCR 引擎，不佔用伺服器記憶體 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: var(--primary-color);
            margin-top: 0;
        }
        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eeeeee;
        }
        .section:last-child {
            border-bottom: none;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        select, button, input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #cccccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #357abd;
        }
        button.secondary {
            background-color: #e0e0e0;
            color: #333;
        }
        button.secondary:hover {
            background-color: #d0d0d0;
        }
        .result-box {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e8e8e8;
            min-height: 50px;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 8px;
        }
        .loading {
            display: none;
            text-align: center;
            color: #666666;
            font-style: italic;
            margin: 10px 0;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .status-text {
            font-size: 14px;
            color: #ef820a;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌐 免費雙向翻譯機 (免 Key 版)</h1>

    <!-- 語言選擇區 -->
    <div class="section">
        <label for="langSelect">選擇目標外語：</label>
        <select id="langSelect">
            <!-- 這裡會由後端動態載入，先放預設值放閃退 -->
            <option value="日文">日本語 🇯🇵</option>
            <option value="英文">English 🇺🇸</option>
            <option value="韓文">한국어 🇰🇷</option>
        </select>
    </div>

    <!-- 🎤 語音與文字翻譯區 -->
    <div class="section">
        <label>🎤 語音 / 文字雙向翻譯</label>
        <div class="btn-group">
            <button id="btnMeToOther">🗣️ 我說中文 (翻外語)</button>
            <button id="btnOtherToMe">🎧 對方說外語 (翻中文)</button>
        </div>
        <div id="voiceStatus" class="status-text"></div>
        
        <label style="margin-top: 15px; font-size: 14px;">辨識原文：</label>
        <div id="voiceOriginal" class="result-box"></div>
        
        <label style="margin-top: 10px; font-size: 14px;">翻譯結果：</label>
        <div id="voiceTranslated" class="result-box"></div>
    </div>

    <!-- 📸 相機與圖片 OCR 區 -->
    <div class="section">
        <label>📸 圖片 / 拍照翻譯</label>
        <input type="file" id="imageInput" accept="image/*" capture="environment">
        
        <div id="ocrLoading" class="loading">正在前端進行文字辨識 (OCR)，請稍候...</div>
        
        <label style="margin-top: 15px; font-size: 14px;">圖片辨識原文：</label>
        <div id="ocrOriginalResult" class="result-box"></div>
        
        <label style="margin-top: 10px; font-size: 14px;">圖片翻譯結果：</label>
        <div id="ocrTranslatedResult" class="result-box"></div>
    </div>
</div>

<script>
    let languagesConfig = [];
    let recognition = null;

    // 1. 網頁初始化：載入選單
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/languages');
            languagesConfig = await res.json();
            
            const select = document.getElementById('langSelect');
            select.innerHTML = ''; // 清空預設
            
            languagesConfig.forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang.name;
                opt.innerText = lang.label || lang.name;
                select.appendChild(opt);
            });
        } catch (err) {
            console.error("載入語言檔失敗，使用網頁預設語系", err);
        }

        // 初始化瀏覽器內建語音辨識 (Web Speech API)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
        } else {
            alert("您的瀏覽器不支援內建語音辨識，語音功能將無法使用（建議使用 Safari 或 Chrome）");
        }
    });

    // 取得當前選中語言的詳細物件資料
    function getSelectedLangObj() {
        const name = document.getElementById('langSelect').value;
        return languagesConfig.find(l => l.name === name) || { name: "英文", code: "en", voice: "en-US" };
    }

    // 🔊 瀏覽器內建語音朗讀 (TTS)
    function speakText(text, langCode) {
        if (!window.speechSynthesis) return;
        // 停止上一次還沒唸完的語音
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langCode;
        window.speechSynthesis.speak(utterance);
    }

    // 🎤 處理語音翻譯的核心函式
    function startVoiceTranslation(mode) {
        if (!recognition) return;
        
        const targetLang = getSelectedLangObj();
        const statusDiv = document.getElementById('voiceStatus');
        const originalDiv = document.getElementById('voiceOriginal');
        const translatedDiv = document.getElementById('voiceTranslated');

        // 設定語音辨識的輸入語言
        if (mode === 'me') {
            recognition.lang = 'zh-TW'; // 我說中文
            statusDiv.innerText = "請開始說中文...";
        } else {
            recognition.lang = targetLang.voice || 'en-US'; // 對方說外語
            statusDiv.innerText = `請開始說 ${targetLang.name}...`;
        }

        recognition.start();

        recognition.onresult = async (event) => {
            const resultText = event.results[0][0].transcript;
            originalDiv.innerText = resultText;
            statusDiv.innerText = "正在免費翻譯中...";

            try {
                // 發送給後端做免費的 Google 翻譯
                const response = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: resultText,
                        target: targetLang.name,
                        mode: mode
                    })
                });
                const data = await response.json();
                
                if (data.translatedText) {
                    translatedDiv.innerText = data.translatedText;
                    statusDiv.innerText = "翻譯完成！";
                    
                    // 自動語音朗讀成果
                    if (mode === 'me') {
                        // 中翻外：朗讀外語
                        speakText(data.translatedText, targetLang.voice);
                    } else {
                        // 外翻中：朗讀中文
                        speakText(data.translatedText, 'zh-TW');
                    }
                } else {
                    statusDiv.innerText = "翻譯回傳空值";
                }
            } catch (err) {
                statusDiv.innerText = "翻譯失敗";
                console.error(err);
            }
        };

        recognition.onerror = (e) => {
            statusDiv.innerText = `語音辨識出錯 (${e.error})`;
            console.error(e);
        };

        recognition.onend = () => {
            if (statusDiv.innerText.startsWith("請開始說")) {
                statusDiv.innerText = "未偵測到聲音，請重試。";
            }
        };
    }

    // 綁定語音按鈕事件
    document.getElementById('btnMeToOther').addEventListener('click', () => startVoiceTranslation('me'));
    document.getElementById('btnOtherToMe').addEventListener('click', () => startVoiceTranslation('other'));


    // 📸 📸 📸 圖片/相機 OCR 處理區 (核心改寫：改由前端 Tesseract.js 執行) 📸 📸 📸
    document.getElementById('imageInput').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const menuLang = document.getElementById('langSelect').value;
        const loadingDiv = document.getElementById('ocrLoading');
        const ocrOriginalDiv = document.getElementById('ocrOriginalResult');
        const ocrTranslatedDiv = document.getElementById('ocrTranslatedResult');

        // 清空舊數據並顯示轉圈提示
        ocrOriginalDiv.innerText = "";
        ocrTranslatedDiv.innerText = "";
        loadingDiv.style.display = "block";

        // 對應 Tesseract.js 的前端語系包代碼
        let tesseractLang = 'eng'; 
        if (menuLang === '日文') tesseractLang = 'jpn';
        else if (menuLang === '韓文') tesseractLang = 'kor';
        else if (menuLang === '中文' || menuLang === '繁體中文') tesseractLang = 'chi_tra';
        else if (menuLang === '法文') tesseractLang = 'fra';
        else if (menuLang === '德文') tesseractLang = 'deu';
        else if (menuLang === '西班牙文') tesseractLang = 'spa';

        try {
            // 步驟 1：直接在手機/電腦本地瀏覽器進行 OCR 識別，完全不消耗伺服器記憶體！
            const result = await Tesseract.recognize(file, tesseractLang, {
                logger: m => {
                    if (m.status === 'recognizing') {
                        loadingDiv.innerText = `文字辨識中：${Math.floor(m.progress * 100)}%`;
                    }
                }
            });
            
            const detectedText = result.data.text ? result.data.text.trim() : "";

            if (!detectedText) {
                loadingDiv.style.display = "none";
                ocrOriginalDiv.innerText = "未能辨識出文字";
                ocrTranslatedDiv.innerText = "圖片中似乎找不到文字，請換張更清晰的相片再試。";
                return;
            }

            ocrOriginalDiv.innerText = detectedText;
            loadingDiv.innerText = "辨識成功！正在調用後端免費 Google 翻譯...";

            // 步驟 2：將辨識出的文字傳給後端路由進行文字翻譯
            const response = await fetch('/ocr_translate_text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: detectedText,
                    menu_lang: menuLang
                })
            });

            const data = await response.json();
            
            if (data.ocrTranslated) {
                ocrTranslatedDiv.innerText = data.ocrTranslated;
            } else {
                ocrTranslatedDiv.innerText = "翻譯失敗，請重新嘗試。";
            }

        } catch (error) {
            console.error("前端 OCR 發生錯誤:", error);
            ocrOriginalDiv.innerText = "辨識發生錯誤";
            ocrTranslatedDiv.innerText = error.message;
        } finally {
            loadingDiv.style.display = "none";
            loadingDiv.innerText = "正在前端進行文字辨識 (OCR)，請稍候...";
            // 清空 input 讓同一張圖片可以重複觸發變更事件
            document.getElementById('imageInput').value = "";
        }
    });
</script>

</body>
</html>
