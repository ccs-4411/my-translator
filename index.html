<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AI 翻譯官 - Tesseract OCR</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 16px;
            text-align: center;
        }

        .card {
            max-width: 560px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #1a73e8;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 1.8rem;
        }

        .top-menu {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .top-menu button {
            flex: 1;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            background: #e8eaed;
            color: #1a73e8;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .top-menu button:first-child {
            background: #1a73e8;
            color: white;
        }

        #status {
            background: #f1f3f4;
            padding: 8px 12px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #1a73e8;
            font-weight: 500;
            margin-bottom: 20px;
            display: inline-block;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 28px;
            border: 1px solid #dadce0;
            background: white;
            font-size: 1rem;
            margin-bottom: 20px;
            font-weight: 500;
            outline: none;
        }

        select:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        .btn-group {
            display: flex;
            gap: 14px;
            margin: 20px 0;
        }

        .mic-btn {
            flex: 1;
            height: 130px;
            border: none;
            border-radius: 28px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            background: #1a73e8;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #btn-other {
            background: #34a853;
        }

        .active-mic {
            background: #ea4335 !important;
            transform: scale(0.96);
        }

        #result-box,
        #ocr-result-box {
            background: #f8f9fa;
            border-radius: 24px;
            padding: 18px;
            text-align: left;
            margin-top: 10px;
            border: 1px solid #e8eaed;
        }

        #original,
        #ocrOriginal {
            color: #5f6368;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
            max-height: 200px;
            overflow-y: auto;
        }

        #translated,
        #ocrTranslated {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 12px;
            color: #202124;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .play-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .play-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 28px;
            background: #ff9800;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #ocrPage {
            display: none;
        }

        #previewImage {
            width: 100%;
            border-radius: 24px;
            margin: 12px 0;
            display: none;
            max-height: 380px;
            object-fit: contain;
            background: #f1f3f4;
            border: 1px solid #ddd;
        }

        .ocr-buttons {
            display: flex;
            gap: 12px;
            margin: 12px 0;
        }

        .ocr-buttons button {
            flex: 1;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            color: white;
        }

        #pickBtn {
            background: #1a73e8;
        }

        #scanBtn {
            background: #0d652d;
        }

        #ocrSpeakBtn {
            background: #ff9800;
        }

        #stopBtn {
            background: #d93025;
        }

        /* 語言選擇器 */
        .ocr-lang-select {
            margin: 10px 0;
            text-align: left;
        }

        .ocr-lang-select label {
            font-size: 0.85rem;
            color: #5f6368;
            margin-right: 10px;
        }

        .ocr-lang-select select {
            width: auto;
            display: inline-block;
            padding: 8px 12px;
            margin-bottom: 0;
            font-size: 0.85rem;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #1a73e8;
            transition: width 0.3s;
        }

        .tip {
            margin-top: 18px;
            background: #e8f0fe;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #174ea6;
            text-align: center;
        }

        .loading-pulse {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 0.4; }
            100% { opacity: 0.7; }
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>🔍 AI 翻譯官</h2>
        <div class="top-menu">
            <button onclick="showVoicePage()">🎤 語音翻譯</button>
            <button onclick="showOCRPage()">📸 掃描翻譯</button>
        </div>
        <div id="status">✅ 準備就緒</div>

        <!-- 語音區塊 -->
        <div id="voicePage">
            <select id="target"></select>
            <div class="btn-group">
                <button id="btn-me" class="mic-btn" onclick="runMic('me')">🎙️ 我說中文</button>
                <button id="btn-other" class="mic-btn" onclick="runMic('other')">🗣️ 對方外語</button>
            </div>
            <div id="result-box">
                <div id="original">等待錄音⋯</div>
                <div id="translated">翻譯結果</div>
                <div class="play-group">
                    <button id="replay-btn" class="play-btn" onclick="replayAudio()">🔊 重播譯文</button>
                </div>
            </div>
        </div>

        <!-- OCR 掃描區塊 - 使用 Tesseract.js -->
        <div id="ocrPage">
            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
            <img id="previewImage" alt="預覽圖片">
            
            <div class="ocr-lang-select">
                <label>🔤 辨識語言：</label>
                <select id="ocrLang">
                    <option value="eng">英文 (English)</option>
                    <option value="chi_tra">繁體中文</option>
                    <option value="chi_sim">簡體中文</option>
                    <option value="jpn">日文</option>
                    <option value="kor">韓文</option>
                    <option value="eng+chi_tra">英文+繁體中文</option>
                    <option value="eng+jpn">英文+日文</option>
                </select>
            </div>

            <div class="ocr-buttons">
                <button id="pickBtn">📷 拍照 / 選照片</button>
                <button id="scanBtn">🔍 Tesseract OCR 辨識</button>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="ocr-buttons">
                <button id="ocrSpeakBtn">🔊 朗讀翻譯</button>
                <button id="stopBtn">⛔ 停止朗讀</button>
            </div>
            <div id="ocr-result-box">
                <div id="ocrOriginal">📖 等待掃描圖片...</div>
                <div id="ocrTranslated">✨ 翻譯結果</div>
            </div>
            <div class="tip">
                💡 <strong>Tesseract OCR 引擎</strong>：專業光學字元辨識，對英文、數字、印刷體辨識率極高！<br>
                📌 建議：圖片越清晰、對比度越高，辨識效果越好。
            </div>
        </div>
    </div>

    <script>
        // ========== 全域變數 ==========
        let recognition = null;
        let VOICES = [];
        let lastSpeakText = "";
        let lastSpeakLang = "zh-TW";
        let selectedImageFile = null;
        let currentImageUrl = null;

        // ========== Service Worker ==========
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(e => console.warn("SW註冊失敗", e));
        }

        // ========== 頁面切換 ==========
        function showVoicePage() {
            document.getElementById("voicePage").style.display = "block";
            document.getElementById("ocrPage").style.display = "none";
            document.getElementById("status").innerText = "🎤 語音模式";
        }

        function showOCRPage() {
            document.getElementById("voicePage").style.display = "none";
            document.getElementById("ocrPage").style.display = "block";
            document.getElementById("status").innerText = "📸 掃描模式 (Tesseract OCR)";
        }

        // ========== 語音合成初始化 ==========
        function loadVoices() {
            return new Promise(resolve => {
                let voices = speechSynthesis.getVoices();
                if (voices.length) return resolve(voices);
                speechSynthesis.onvoiceschanged = () => resolve(speechSynthesis.getVoices());
            });
        }

        async function initSpeech() {
            VOICES = await loadVoices();
        }

        // ========== 語言清單 ==========
        async function initLangs() {
            try {
                const res = await fetch("/languages");
                const langs = await res.json();
                const sel = document.getElementById("target");
                sel.innerHTML = "";
                langs.forEach(l => {
                    const opt = document.createElement("option");
                    opt.value = l.name;
                    opt.textContent = `${l.name} ${l.label}`;
                    opt.dataset.v = l.voice;
                    sel.appendChild(opt);
                });
            } catch (err) {
                console.error("語言載入錯誤", err);
            }
        }

        // ========== 語音辨識初始化 ==========
        function initRecognition() {
            const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
            if (!Speech) {
                alert("此瀏覽器不支援語音辨識，請使用 Chrome / Edge / Safari");
                return;
            }
            recognition = new Speech();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                document.getElementById("status").innerText = "🎙️ 聆聽中，請說話...";
            };
            recognition.onerror = (e) => {
                console.warn(e);
                document.getElementById("status").innerText = "❌ 無法辨識，請重新點擊";
                const btnMe = document.getElementById("btn-me");
                const btnOther = document.getElementById("btn-other");
                btnMe.classList.remove("active-mic");
                btnOther.classList.remove("active-mic");
            };
            recognition.onend = () => {
                const btnMe = document.getElementById("btn-me");
                const btnOther = document.getElementById("btn-other");
                btnMe.classList.remove("active-mic");
                btnOther.classList.remove("active-mic");
            };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById("original").innerText = text;
                handleTranslation(text);
            };
        }

        function runMic(mode) {
            if (!recognition) initRecognition();
            if (!recognition) return;

            const sel = document.getElementById("target");
            const selectedOption = sel.selectedOptions[0];
            if (mode === "me") {
                recognition.lang = "zh-TW";
            } else {
                const voiceLang = selectedOption?.dataset.v || "en-US";
                recognition.lang = voiceLang;
            }

            const btnMe = document.getElementById("btn-me");
            const btnOther = document.getElementById("btn-other");
            btnMe.classList.remove("active-mic");
            btnOther.classList.remove("active-mic");
            if (mode === "me") btnMe.classList.add("active-mic");
            else btnOther.classList.add("active-mic");

            try {
                recognition.start();
            } catch (err) {
                console.warn(err);
                document.getElementById("status").innerText = "⚠️ 請允許麥克風權限";
            }
        }

        // ========== 語音翻譯 (Google 翻譯) ==========
        async function handleTranslation(text) {
            document.getElementById("status").innerText = "🔄 Google 翻譯中 ...";
            const sel = document.getElementById("target");
            const targetName = sel.value;
            let mode = "me";
            if (recognition && recognition.lang && recognition.lang !== "zh-TW") mode = "other";

            try {
                const res = await fetch("/translate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text, target: targetName, mode: mode })
                });
                const data = await res.json();
                const translated = data.translatedText || "翻譯失敗";
                document.getElementById("translated").innerText = translated;
                let ttsLang = (mode === "me") ? (sel.selectedOptions[0]?.dataset.v || "en-US") : "zh-TW";
                speak(translated, ttsLang);
                document.getElementById("status").innerText = "✅ 翻譯完成";
            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText = "❌ 連線錯誤";
            }
        }

        // ========== 語音朗讀 ==========
        function speak(text, lang) {
            if (!text) return;
            lastSpeakText = text;
            lastSpeakLang = lang;
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            let matchedVoice = VOICES.find(v => v.lang.replace('_', '-') === lang) ||
                VOICES.find(v => v.lang.startsWith(lang.split('-')[0]));
            if (matchedVoice) utterance.voice = matchedVoice;
            speechSynthesis.speak(utterance);
        }

        function replayAudio() {
            if (lastSpeakText) speak(lastSpeakText, lastSpeakLang);
        }

        // ========== 圖片預處理 (增強對比度) ==========
        async function preprocessImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 2000;
                    if (width > MAX_WIDTH) {
                        height = (height * MAX_WIDTH) / width;
                        width = MAX_WIDTH;
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 增強對比度讓文字更清晰
                    const imageData = ctx.getImageData(0, 0, width, height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i];
                        let g = data[i + 1];
                        let b = data[i + 2];
                        // 對比度增強
                        const contrast = 1.2;
                        r = Math.min(255, Math.max(0, (r - 128) * contrast + 128));
                        g = Math.min(255, Math.max(0, (g - 128) * contrast + 128));
                        b = Math.min(255, Math.max(0, (b - 128) * contrast + 128));
                        data[i] = r;
                        data[i + 1] = g;
                        data[i + 2] = b;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    
                    canvas.toBlob(blob => {
                        URL.revokeObjectURL(url);
                        resolve(blob);
                    }, "image/jpeg", 0.9);
                };
                img.src = url;
            });
        }

        // ========== Tesseract OCR 辨識 ==========
        async function performOCR() {
            if (!selectedImageFile) {
                alert("請先拍照或選取圖片");
                return;
            }

            const statusDiv = document.getElementById("status");
            const ocrBox = document.getElementById("ocr-result-box");
            const progressBar = document.getElementById("progressBar");
            const progressFill = document.getElementById("progressFill");
            
            statusDiv.innerText = "🔍 圖片預處理中...";
            ocrBox.classList.add("loading-pulse");
            
            try {
                // 預處理圖片
                const processedBlob = await preprocessImage(selectedImageFile);
                const imageUrl = URL.createObjectURL(processedBlob);
                const img = new Image();
                img.src = imageUrl;
                
                await new Promise((resolve) => { img.onload = resolve; });
                
                const ocrLang = document.getElementById("ocrLang").value;
                statusDiv.innerText = `🔍 Tesseract OCR 辨識中 (${ocrLang})...`;
                progressBar.style.display = "block";
                
                // 使用 Tesseract.js 進行 OCR
                const worker = await Tesseract.createWorker();
                await worker.loadLanguage(ocrLang);
                await worker.initialize(ocrLang);
                
                // 設定進度回調
                worker.setProgress((p) => {
                    const percent = Math.round(p.progress * 100);
                    progressFill.style.width = `${percent}%`;
                    statusDiv.innerText = `🔍 OCR 辨識中... ${percent}%`;
                });
                
                const { data: { text } } = await worker.recognize(img);
                await worker.terminate();
                
                URL.revokeObjectURL(imageUrl);
                progressBar.style.display = "none";
                progressFill.style.width = "0%";
                
                let ocrText = text.trim();
                if (!ocrText || ocrText.length < 2) {
                    ocrText = "無法辨識文字，請確保圖片清晰、光線充足，並選擇正確的語言。";
                }
                
                // 顯示原文
                document.getElementById("ocrOriginal").innerHTML = `📄 辨識原文：<br>${escapeHtml(ocrText)}`;
                
                // 翻譯成繁體中文
                statusDiv.innerText = "🔄 Google 翻譯中...";
                try {
                    const res = await fetch("/translate_ocr", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ text: ocrText })
                    });
                    const data = await res.json();
                    const translated = data.translatedText || "翻譯失敗";
                    document.getElementById("ocrTranslated").innerText = translated;
                    lastSpeakText = translated;
                    statusDiv.innerText = "✅ OCR 完成！自動朗讀翻譯";
                    speak(translated, "zh-TW");
                } catch (transErr) {
                    console.error("翻譯錯誤", transErr);
                    document.getElementById("ocrTranslated").innerText = "翻譯服務錯誤";
                    statusDiv.innerText = "⚠️ 翻譯失敗，但原文已辨識";
                }
                
            } catch (err) {
                console.error("OCR錯誤", err);
                statusDiv.innerText = "⚠️ OCR 辨識失敗，請重新拍攝";
                document.getElementById("ocrOriginal").innerHTML = "辨識錯誤，請確保圖片清晰、光線充足";
                document.getElementById("ocrTranslated").innerText = "無法翻譯";
                progressBar.style.display = "none";
            } finally {
                ocrBox.classList.remove("loading-pulse");
            }
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ========== 圖片選取與預覽 ==========
        document.getElementById("pickBtn").addEventListener("click", () => {
            document.getElementById("imageInput").click();
        });

        document.getElementById("imageInput").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            selectedImageFile = file;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = document.getElementById("previewImage");
                img.src = ev.target.result;
                img.style.display = "block";
                document.getElementById("status").innerText = "🖼️ 圖片已載入，點擊「Tesseract OCR 辨識」";
                document.getElementById("ocrOriginal").innerHTML = "📖 新圖片已選取，按下辨識按鈕";
                document.getElementById("ocrTranslated").innerText = "等待辨識";
            };
            reader.readAsDataURL(file);
        });

        document.getElementById("scanBtn").addEventListener("click", performOCR);
        document.getElementById("ocrSpeakBtn").addEventListener("click", () => {
            if (lastSpeakText) speak(lastSpeakText, "zh-TW");
            else alert("尚無翻譯結果，請先進行OCR辨識");
        });
        document.getElementById("stopBtn").addEventListener("click", () => {
            speechSynthesis.cancel();
            document.getElementById("status").innerText = "⏹️ 已停止朗讀";
        });

        // ========== 初始化 ==========
        window.onload = async () => {
            await initSpeech();
            await initLangs();
            initRecognition();
            showVoicePage();
        };
    </script>
</body>

</html>
