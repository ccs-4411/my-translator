<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>翻譯官</title>

<style>
body { font-family: sans-serif; background:#f2f4f7; text-align:center; padding:15px; }
.card { max-width:450px; margin:auto; background:white; padding:20px; border-radius:25px; }
select { width:100%; padding:12px; font-size:1rem; }
.btn-group { display:flex; gap:10px; margin-top:15px; }
button { flex:1; padding:20px; border:none; border-radius:15px; color:white; }
#btn-me { background:#1a73e8; }
#btn-other { background:#34a853; }
#result { margin-top:15px; background:#f5f5f5; padding:10px; border-radius:10px; }
</style>
</head>

<body>

<div class="card">
<h2>語音翻譯</h2>

<div id="status">載入中...</div>

<select id="target"></select>

<div class="btn-group">
<button id="btn-me" onclick="runMic('me')">🎤 我講中文</button>
<button id="btn-other" onclick="runMic('other')">🎧 對方</button>
</div>

<div id="result">
<div id="original">...</div>
<div id="translated">翻譯結果</div>
</div>

</div>

<script>

let currentMode = "me";

/* =====================
   防 LINE / iOS 音訊鎖
===================== */
document.addEventListener("click", () => {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
    speechSynthesis.cancel();
}, { once: true });


/* =====================
   初始化（防掛）
===================== */
async function init() {
    try {
        await loadLangs();
        document.getElementById("status").innerText = "準備就緒";
    } catch(e) {
        console.log(e);
        setTimeout(init, 1000);
    }
}

window.addEventListener("load", init);


/* =====================
   語言載入
===================== */
async function loadLangs() {
    const sel = document.getElementById("target");

    const res = await fetch("/languages");
    const data = await res.json();

    sel.innerHTML = "";

    data.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l.name;
        opt.textContent = l.name;
        opt.dataset.v = l.voice;
        sel.appendChild(opt);
    });

    sel.selectedIndex = 0;
}


/* =====================
   語音辨識
===================== */
const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

function runMic(mode) {
    currentMode = mode;

    const sel = document.getElementById("target");

    recognition.lang = mode === "me"
        ? "zh-TW"
        : sel.selectedOptions[0].dataset.v;

    try {
        recognition.start();
    } catch(e) {
        recognition.stop();
    }
}


/* =====================
   timeout fetch（防掛）
===================== */
function fetchTimeout(url, opt, t=8000) {
    return Promise.race([
        fetch(url, opt),
        new Promise((_, r)=>setTimeout(()=>r("timeout"), t))
    ]);
}


/* =====================
   結果
===================== */
recognition.onresult = async (e) => {
    const text = e.results[0][0].transcript;

    document.getElementById("original").innerText = text;

    const sel = document.getElementById("target");

    try {
        const res = await fetchTimeout("/", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
                text,
                target: sel.value,
                mode: currentMode
            })
        });

        const data = await res.json();

        document.getElementById("translated").innerText = data.translatedText;

        speak(data.translatedText, sel.selectedOptions[0].dataset.v);

    } catch(e) {
        document.getElementById("translated").innerText = "網路或伺服器忙";
    }
};


/* =====================
   TTS（穩定版）
===================== */
async function speak(text, lang) {
    try {
        const res = await fetch("/tts", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
                text,
                lang: lang.split("-")[0]
            })
        });

        const data = await res.json();

        const audio = new Audio(data.audio_url);
        audio.play();

    } catch(e) {
        console.log("TTS fail", e);
    }
}

</script>

</body>
</html>
