<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 翻譯官</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 1rem; }
        #micBtn { height: 80px; width: 80px; border-radius: 50%; font-size: 2rem; background: #4A90E2; color: white; border: none; cursor: pointer; }
        #micBtn.active { background: #e74c3c; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .result { margin-top: 20px; font-weight: bold; font-size: 1.5rem; color: #333; min-height: 50px; }
    </style>
</head>
<body>
    <div class="box">
        <div id="status" style="font-size:0.8rem; color: #666;">系統就緒</div>
        <select id="engine"><option value="gemini">AI 模式</option><option value="google">傳統模式</option></select>
        <select id="target"><option value="英文">英文 🇺🇸</option><option value="日文">日文 🇯🇵</option></select>
        <button id="micBtn">🎤</button>
        <div id="origin" style="color:#999; font-size:0.9rem; margin-top:10px;">聽到的文字...</div>
        <div id="result" class="result">...</div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const targetSel = document.getElementById('target');
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'zh-TW';

        recognition.onstart = () => micBtn.classList.add('active');
        recognition.onend = () => micBtn.classList.remove('active');
        recognition.onresult = (e) => {
            const text = e.results[0][0].transcript;
            document.getElementById('origin').innerText = text;
            doTranslate(text);
        };

        async function doTranslate(text) {
            document.getElementById('status').innerText = "處理中...";
            const res = await fetch('/translate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text, target: targetSel.value, engine: document.getElementById('engine').value})
            });
            const data = await res.json();
            const out = data.translatedText;
            document.getElementById('result').innerText = out;
            document.getElementById('status').innerText = "完成";
            
            // 修正：針對不同語系強迫指定發音代碼
            let voiceCode = 'en-US';
            if(targetSel.value === '日文') voiceCode = 'ja-JP';
            
            speak(out, voiceCode);
        }

        function speak(text, code) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = code;
            // 英文如果沒聲音，嘗試強制指定給系統中第一個英文人聲
            const voices = window.speechSynthesis.getVoices();
            if(code.includes('en')) {
                const enVoice = voices.find(v => v.lang.startsWith('en'));
                if(enVoice) msg.voice = enVoice;
            }
            window.speechSynthesis.speak(msg);
        }

        micBtn.onclick = () => {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); // 喚醒手機語音
            recognition.start();
        };
    </script>
</body>
</html>
