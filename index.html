<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>語音翻譯官</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#f2f4f7; margin:0; padding:15px; text-align:center; -webkit-tap-highlight-color: transparent; }
        .card { max-width:450px; margin:auto; background:white; padding:25px; border-radius:30px; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
        h2 { color:#1a73e8; margin-top:0; font-size: 1.6rem; cursor: pointer; }
        #status { font-size:0.9rem; color:#1a73e8; margin-bottom:12px; font-weight: bold; height: 1.2em; }
        select { width:100%; padding:14px; border-radius:15px; border:2px solid #eee; font-size:1.1rem; margin-bottom:10px; background:white; -webkit-appearance: none; outline: none; }
        .btn-group { display:flex; gap:12px; margin:20px 0; }
        .mic-btn { flex:1; height:120px; border:none; border-radius:25px; color:white; font-size:1.2rem; cursor:pointer; font-weight: bold; transition: all 0.2s; -webkit-user-select: none; }
        #btn-me { background:#1a73e8; }
        #btn-other { background:#34a853; }
        .active { background:#ea4335 !important; transform: scale(0.96); opacity: 0.8; }
        #result-box { background:#f8f9fa; border-radius:20px; padding:18px; text-align:left; min-height: 120px; border: 1px solid #eee; }
        #original { color:#888; border-bottom:1px solid #eee; padding-bottom:8px; font-size:0.95rem; }
        #translated { font-size:1.5rem; font-weight:bold; margin-top:12px; color:#111; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <h2 onclick="testSpeech()">語音翻譯官</h2>
    <div id="status">準備就緒</div>
    <select id="target"></select>
    <div class="btn-group">
        <button id="btn-me" class="mic-btn" onclick="runMic('me')">🎤 我講中文</button>
        <button id="btn-other" class="mic-btn" onclick="runMic('other')">🎧 對方講 <span id="target-name"></span></button>
    </div>
    <div id="result-box">
        <div id="original">等待說話...</div>
        <div id="translated">翻譯結果</div>
    </div>
</div>

<script>
let recognition = null;
let isProcessing = false;

function initRecognition() {
    const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
    if (!Speech) {
        document.getElementById("status").innerText = "瀏覽器不支持辨識";
        return;
    }
    recognition = new Speech();
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById("original").innerText = text;
        handleTranslation(text);
    };

    recognition.onerror = (e) => {
        console.error("辨識錯誤:", e.error);
        if (e.error === 'aborted') {
            document.getElementById("status").innerText = "⚠️ 系統繁忙，請再點一次";
        } else {
            document.getElementById("status").innerText = "❌ 失敗: " + e.error;
        }
        resetUI();
    };

    recognition.onend = () => {
        resetUI();
    };
}

function testSpeech() {
    speak("測試語音正常", "zh-TW");
}

async function initLangs() {
    try {
        const res = await fetch("/languages");
        const langs = await res.json();
        const sel = document.getElementById("target");
        langs.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.name;
            opt.textContent = `${l.name} ${l.label}`;
            opt.dataset.v = l.voice;
            sel.appendChild(opt);
        });
        const saved = localStorage.getItem("targetLang");
        if (saved) sel.value = saved;
        sync();
    } catch(e) { document.getElementById("status").innerText = "連線失敗"; }
}

function sync() {
    const sel = document.getElementById("target");
    document.getElementById("target-name").innerText = sel.value;
    localStorage.setItem("targetLang", sel.value);
}
document.getElementById("target").addEventListener("change", sync);

function runMic(mode) {
    if (isProcessing) return;
    
    // 1. 強制清空所有語音任務，避免語音佔用音訊通道導致麥克風 aborted
    window.speechSynthesis.cancel();
    
    if (!recognition) initRecognition();

    const sel = document.getElementById("target");
    const isMe = (mode === "me");
    recognition.lang = isMe ? "zh-TW" : sel.selectedOptions[0].dataset.v;
    
    // UI 反饋
    document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(isMe ? 'btn-me' : 'btn-other').classList.add('active');
    document.getElementById("status").innerText = "🎤 準備中...";

    // 2. 核心修正：先 abort 再延遲啟動
    try { recognition.abort(); } catch(e) {}
    
    setTimeout(() => {
        try {
            recognition.start();
            document.getElementById("status").innerText = "🎤 正在聆聽...";
        } catch(e) {
            recognition.stop();
            setTimeout(() => recognition.start(), 300);
        }
    }, 350); // 給予系統足夠時間切換音訊模式
}

async function handleTranslation(text) {
    isProcessing = true;
    document.getElementById("status").innerText = "🔄 翻譯中...";
    const sel = document.getElementById("target");
    const isMe = (recognition.lang === "zh-TW");

    try {
        const res = await fetch("/translate", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ text, target: sel.value, mode: isMe ? "me" : "other" })
        });
        const data = await res.json();
        document.getElementById("translated").innerText = data.translatedText;
        document.getElementById("status").innerText = "✅ 完成";

        const playLang = isMe ? sel.selectedOptions[0].dataset.v : "zh-TW";
        speak(data.translatedText, playLang);
    } catch (err) {
        document.getElementById("status").innerText = "❌ 翻譯失敗";
    } finally {
        isProcessing = false;
    }
}

function resetUI() {
    document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
}

function speak(text, lang) {
    // 播放前確保完全取消之前的播放
    window.speechSynthesis.cancel();
    
    const msg = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();
    const voice = voices.find(v => v.lang.replace('_','-') === lang) || 
                  voices.find(v => v.lang.startsWith(lang.split('-')[0]));
    
    if (voice) msg.voice = voice;
    msg.lang = lang;
    msg.volume = 1.0;
    msg.rate = 1.0;
    
    // iOS PWA 必須在微延遲後播放，避開當前的事件循環
    setTimeout(() => {
        window.speechSynthesis.speak(msg);
    }, 150);
}

initLangs();
initRecognition();
</script>
</body>
</html>
