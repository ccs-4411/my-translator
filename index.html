<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AI 翻譯官</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            padding: 16px;
            min-height: 100vh;
        }

        .card {
            max-width: 560px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #1a73e8;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .top-menu {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .top-menu button {
            flex: 1;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .top-menu button:first-child {
            background: #1a73e8;
            color: white;
        }

        .top-menu button:last-child {
            background: #e8eaed;
            color: #1a73e8;
        }

        #status {
            background: #e8f0fe;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #1a73e8;
            font-weight: 500;
            text-align: center;
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 28px;
            border: 1px solid #dadce0;
            background: white;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        .btn-group {
            display: flex;
            gap: 14px;
            margin: 20px 0;
        }

        .mic-btn {
            flex: 1;
            height: 130px;
            border: none;
            border-radius: 28px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #btn-me {
            background: #1a73e8;
        }

        #btn-other {
            background: #34a853;
        }

        .active-mic {
            background: #ea4335 !important;
            transform: scale(0.96);
        }

        #result-box, #ocr-result-box {
            background: #f8f9fa;
            border-radius: 24px;
            padding: 18px;
            margin-top: 10px;
            border: 1px solid #e8eaed;
        }

        #original, #ocrOriginal {
            color: #5f6368;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
            max-height: 200px;
            overflow-y: auto;
        }

        #translated, #ocrTranslated {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 12px;
            color: #202124;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .play-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .play-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 28px;
            background: #ff9800;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #ocrPage {
            display: none;
        }

        #previewImage {
            width: 100%;
            border-radius: 24px;
            margin: 12px 0;
            display: none;
            max-height: 300px;
            object-fit: contain;
            background: #f1f3f4;
            border: 1px solid #ddd;
        }

        .ocr-buttons {
            display: flex;
            gap: 12px;
            margin: 12px 0;
        }

        .ocr-buttons button {
            flex: 1;
            border: none;
            border-radius: 40px;
            padding: 12px 0;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            color: white;
        }

        #pickBtn { background: #1a73e8; }
        #scanBtn { background: #0d652d; }
        #ocrSpeakBtn { background: #ff9800; }
        #stopBtn { background: #d93025; }

        .lang-selector {
            margin: 10px 0;
            text-align: left;
        }

        .lang-selector label {
            font-size: 0.85rem;
            color: #5f6368;
            margin-right: 10px;
        }

        .lang-selector select {
            width: auto;
            display: inline-block;
            padding: 8px 12px;
            margin-bottom: 0;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #1a73e8;
            transition: width 0.3s;
        }

        .tip {
            margin-top: 18px;
            background: #e8f0fe;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #174ea6;
            text-align: center;
        }

        .loading {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        button {
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔍 AI 翻譯官</h2>
        
        <div class="top-menu">
            <button onclick="showVoicePage()">🎤 語音翻譯</button>
            <button onclick="showOCRPage()">📸 掃描翻譯</button>
        </div>
        
        <div id="status">✅ 準備就緒</div>

        <!-- 語音翻譯頁面 -->
        <div id="voicePage">
            <select id="target"></select>
            <div class="btn-group">
                <button id="btn-me" class="mic-btn" onclick="runMic('me')">🎙️ 我說中文</button>
                <button id="btn-other" class="mic-btn" onclick="runMic('other')">🗣️ 對方外語</button>
            </div>
            <div id="result-box">
                <div id="original">等待說話...</div>
                <div id="translated">翻譯結果</div>
                <div class="play-group">
                    <button class="play-btn" onclick="replayAudio()">🔊 重播譯文</button>
                </div>
            </div>
        </div>

        <!-- OCR掃描頁面 - Tesseract.js 版 -->
        <div id="ocrPage">
            <input type="file" id="imageInput" accept="image/*" capture="environment" hidden>
            <img id="previewImage" alt="預覽圖片">
            
            <div class="lang-selector">
                <label>🔤 OCR 語言：</label>
                <select id="ocrLang">
                    <option value="eng">英文</option>
                    <option value="chi_tra">繁體中文</option>
                    <option value="chi_sim">簡體中文</option>
                    <option value="jpn">日文</option>
                    <option value="kor">韓文</option>
                    <option value="eng+chi_tra">英文+繁體中文</option>
                </select>
            </div>
            
            <div class="ocr-buttons">
                <button id="pickBtn">📷 拍照 / 選照片</button>
                <button id="scanBtn">🔍 OCR 辨識翻譯</button>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="ocr-buttons">
                <button id="ocrSpeakBtn">🔊 朗讀翻譯</button>
                <button id="stopBtn">⛔ 停止朗讀</button>
            </div>
            <div id="ocr-result-box">
                <div id="ocrOriginal">等待掃描圖片...</div>
                <div id="ocrTranslated">翻譯結果</div>
            </div>
            <div class="tip">
                💡 Tesseract OCR 引擎 - 完全免費，無需 API Key<br>
                📌 提示：光線充足、文字清晰，辨識效果更好。英文辨識率最高。
            </div>
        </div>
    </div>

    <script>
        let recognition = null;
        let voices = [];
        let lastText = "";
        let lastLang = "zh-TW";
        let selectedFile = null;

        // 切換頁面
        function showVoicePage() {
            document.getElementById('voicePage').style.display = 'block';
            document.getElementById('ocrPage').style.display = 'none';
            document.getElementById('status').innerText = '🎤 語音翻譯模式';
        }

        function showOCRPage() {
            document.getElementById('voicePage').style.display = 'none';
            document.getElementById('ocrPage').style.display = 'block';
            document.getElementById('status').innerText = '📸 掃描翻譯模式 (Tesseract OCR)';
        }

        // 載入語音
        async function loadVoices() {
            return new Promise(resolve => {
                let v = speechSynthesis.getVoices();
                if (v.length) resolve(v);
                speechSynthesis.onvoiceschanged = () => resolve(speechSynthesis.getVoices());
            });
        }

        // 載入語言清單
        async function loadLanguages() {
            try {
                const res = await fetch('/languages');
                const langs = await res.json();
                const sel = document.getElementById('target');
                sel.innerHTML = '';
                langs.forEach(l => {
                    const opt = document.createElement('option');
                    opt.value = l.name;
                    opt.textContent = `${l.name} ${l.label}`;
                    opt.dataset.voice = l.voice;
                    sel.appendChild(opt);
                });
            } catch(e) { console.error(e); }
        }

        // 語音辨識
        function initRecognition() {
            const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
            if (!Speech) {
                alert('瀏覽器不支援語音辨識');
                return;
            }
            recognition = new Speech();
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => document.getElementById('status').innerText = '🎙️ 聆聽中...';
            recognition.onerror = () => document.getElementById('status').innerText = '❌ 辨識失敗';
            recognition.onend = () => {
                document.getElementById('btn-me').classList.remove('active-mic');
                document.getElementById('btn-other').classList.remove('active-mic');
            };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('original').innerText = text;
                translateText(text);
            };
        }

        function runMic(mode) {
            if (!recognition) initRecognition();
            if (!recognition) return;
            
            const sel = document.getElementById('target');
            const opt = sel.selectedOptions[0];
            
            if (mode === 'me') {
                recognition.lang = 'zh-TW';
            } else {
                recognition.lang = opt?.dataset?.voice || 'en-US';
            }
            
            document.getElementById('btn-me').classList.remove('active-mic');
            document.getElementById('btn-other').classList.remove('active-mic');
            document.getElementById(`btn-${mode}`).classList.add('active-mic');
            
            try {
                recognition.start();
            } catch(e) {
                document.getElementById('status').innerText = '⚠️ 請允許麥克風權限';
            }
        }

        // 翻譯
        async function translateText(text) {
            const sel = document.getElementById('target');
            const targetName = sel.value;
            const mode = recognition?.lang === 'zh-TW' ? 'me' : 'other';
            
            try {
                const res = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, target: targetName, mode })
                });
                const data = await res.json();
                document.getElementById('translated').innerText = data.translatedText;
                
                const ttsLang = mode === 'me' ? (sel.selectedOptions[0]?.dataset?.voice || 'en-US') : 'zh-TW';
                speak(data.translatedText, ttsLang);
                document.getElementById('status').innerText = '✅ 翻譯完成';
            } catch(e) {
                document.getElementById('status').innerText = '❌ 翻譯失敗';
            }
        }

        // 語音合成
        async function speak(text, lang) {
            if (!text) return;
            lastText = text;
            lastLang = lang;
            const v = await loadVoices();
            speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = lang;
            const match = v.find(vv => vv.lang.replace('_', '-') === lang) || v.find(vv => vv.lang.startsWith(lang.split('-')[0]));
            if (match) utter.voice = match;
            speechSynthesis.speak(utter);
        }

        function replayAudio() {
            if (lastText) speak(lastText, lastLang);
        }

        // 圖片預處理
        async function preprocessImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 2000;
                    if (width > MAX_WIDTH) {
                        height = (height * MAX_WIDTH) / width;
                        width = MAX_WIDTH;
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 增強對比度
                    const imageData = ctx.getImageData(0, 0, width, height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i];
                        let g = data[i+1];
                        let b = data[i+2];
                        r = Math.min(255, Math.max(0, (r - 128) * 1.3 + 128));
                        g = Math.min(255, Math.max(0, (g - 128) * 1.3 + 128));
                        b = Math.min(255, Math.max(0, (b - 128) * 1.3 + 128));
                        data[i] = r;
                        data[i+1] = g;
                        data[i+2] = b;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    
                    canvas.toBlob(blob => {
                        URL.revokeObjectURL(url);
                        resolve(blob);
                    }, "image/jpeg", 0.9);
                };
                img.src = url;
            });
        }

        // Tesseract OCR 辨識
        async function performOCR() {
            if (!selectedFile) {
                alert('請先拍照或選取圖片');
                return;
            }
            
            const status = document.getElementById('status');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const ocrLang = document.getElementById('ocrLang').value;
            
            status.innerText = '🔍 圖片處理中...';
            progressBar.style.display = 'block';
            progressFill.style.width = '20%';
            
            try {
                const processedBlob = await preprocessImage(selectedFile);
                progressFill.style.width = '40%';
                status.innerText = `🔍 Tesseract OCR 辨識中 (${ocrLang})...`;
                
                const worker = await Tesseract.createWorker();
                await worker.loadLanguage(ocrLang);
                await worker.initialize(ocrLang);
                
                worker.setProgress((p) => {
                    const percent = 40 + Math.round(p.progress * 50);
                    progressFill.style.width = `${percent}%`;
                    status.innerText = `🔍 辨識中 ${percent}%...`;
                });
                
                const img = new Image();
                const imgUrl = URL.createObjectURL(processedBlob);
                img.src = imgUrl;
                await new Promise((resolve) => { img.onload = resolve; });
                
                const { data: { text } } = await worker.recognize(img);
                await worker.terminate();
                URL.revokeObjectURL(imgUrl);
                
                progressFill.style.width = '90%';
                
                let ocrText = text.trim();
                if (!ocrText || ocrText.length < 2) {
                    ocrText = '無法辨識文字，請確保圖片清晰、光線充足';
                }
                
                document.getElementById('ocrOriginal').innerHTML = `📄 原文：<br>${escapeHtml(ocrText)}`;
                
                status.innerText = '🔄 Google 翻譯中...';
                
                // 呼叫後端翻譯
                const res = await fetch('/translate_ocr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: ocrText })
                });
                const data = await res.json();
                
                progressFill.style.width = '100%';
                document.getElementById('ocrTranslated').innerHTML = data.translatedText || '翻譯失敗';
                status.innerText = '✅ 辨識完成';
                speak(data.translatedText, 'zh-TW');
                
            } catch(err) {
                console.error('OCR錯誤', err);
                status.innerText = '❌ 辨識失敗';
                document.getElementById('ocrOriginal').innerHTML = '辨識錯誤，請重新拍攝';
            } finally {
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 500);
            }
        }
        
        document.getElementById('pickBtn').onclick = () => {
            document.getElementById('imageInput').click();
        };
        
        document.getElementById('imageInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = document.getElementById('previewImage');
                img.src = ev.target.result;
                img.style.display = 'block';
                document.getElementById('status').innerText = '📷 圖片已載入，點擊辨識';
                document.getElementById('ocrOriginal').innerHTML = '等待辨識...';
                document.getElementById('ocrTranslated').innerHTML = '翻譯結果';
            };
            reader.readAsDataURL(file);
        };
        
        document.getElementById('scanBtn').onclick = performOCR;
        document.getElementById('ocrSpeakBtn').onclick = () => {
            const text = document.getElementById('ocrTranslated').innerText;
            if (text && text !== '翻譯結果') speak(text, 'zh-TW');
            else alert('尚無翻譯結果');
        };
        document.getElementById('stopBtn').onclick = () => {
            speechSynthesis.cancel();
            document.getElementById('status').innerText = '⏹️ 已停止';
        };
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // 初始化
        (async () => {
            await loadVoices();
            await loadLanguages();
            initRecognition();
            showVoicePage();
        })();
    </script>
</body>
</html>
