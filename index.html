<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 雙向翻譯機 (V3)</title>
    <style>
        :root { --primary: #4A90E2; --secondary: #34A853; }
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f0f2f5; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: 10px auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .mode-selector { display: flex; gap: 8px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 12px; background: white; cursor: pointer; font-weight: bold; }
        .mode-btn.active { border-color: var(--primary); background: #eef6ff; color: var(--primary); }
        .mode-btn.other-active { border-color: var(--secondary); background: #e6f4ea; color: var(--secondary); }
        select { width: 100%; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        #micBtn { 
            background: var(--primary); color: white; border: none; width: 100px; height: 100px; 
            border-radius: 50%; font-size: 2.5rem; cursor: pointer; margin: 15px 0;
            transition: 0.3s;
        }
        #micBtn.recording { background: #ea4335; transform: scale(1.1); }
        #micBtn:disabled { background: #ccc; cursor: not-allowed; }
        #translated-text { font-size: 2rem; color: #222; font-weight: bold; margin: 15px 0; min-height: 2.5rem; }
        #status { color: #888; font-size: 0.85rem; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <select id="targetLang" onchange="updateLabels()">
            <option value="日文" data-code="ja-JP">日文 🇯🇵</option>
            <option value="英文" data-code="en-US">英文 🇺🇸</option>
            <option value="韓文" data-code="ko-KR">韓文 🇰🇷</option>
        </select>
        
        <div class="mode-selector">
            <button id="btn-me" class="mode-btn active" onclick="setDir('me')">我說中文</button>
            <button id="btn-other" class="mode-btn" onclick="setDir('other')">對方說<span class="lt">日文</span></button>
        </div>

        <button id="micBtn">🎤</button>
        <div id="original-text" style="color:#666;">等待說話...</div>
        <div id="translated-text">...</div>
        <div id="status">系統準備就緒</div>
    </div>

    <script>
        let dir = 'me', lastText = "", recognition, isPlaying = false;
        const micBtn = document.getElementById('micBtn'), status = document.getElementById('status'),
              tDiv = document.getElementById('translated-text'), oDiv = document.getElementById('original-text'),
              tSel = document.getElementById('targetLang');

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.onstart = () => { micBtn.classList.add('recording'); status.innerText = "聆聽中..."; };
            recognition.onresult = (e) => { 
                const text = e.results[0][0].transcript;
                oDiv.innerText = text;
                doTrans(text);
            };
            recognition.onend = () => { micBtn.classList.remove('recording'); };
        }

        function setDir(d) {
            dir = d;
            document.getElementById('btn-me').className = 'mode-btn ' + (d==='me'?'active':'');
            document.getElementById('btn-other').className = 'mode-btn ' + (d==='other'?'other-active':'');
            recognition.lang = (d==='me') ? 'zh-TW' : tSel.options[tSel.selectedIndex].getAttribute('data-code');
        }

        function updateLabels() {
            document.querySelector('.lt').innerText = tSel.value;
            setDir(dir);
        }

        micBtn.onclick = () => {
            if(isPlaying) return;
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); // 喚醒 iOS
            try { recognition.start(); } catch(e) { recognition.stop(); }
        };

        async function doTrans(text) {
            status.innerText = "翻譯中...";
            try {
                const res = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, target: (dir==='me'?tSel.value:'中文') })
                });
                const data = await res.json();
                tDiv.innerText = data.translatedText;
                speak(data.translatedText, (dir==='me'?tSel.options[tSel.selectedIndex].getAttribute('data-code'):'zh-TW'));
            } catch (err) { status.innerText = "連線失敗"; }
        }

        function speak(t, l) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = l;
            u.onstart = () => { isPlaying = true; micBtn.disabled = true; status.innerText = "AI 說話中..."; };
            u.onend = () => { isPlaying = false; micBtn.disabled = false; status.innerText = "準備就緒"; };
            window.speechSynthesis.speak(u);
        }
        updateLabels();
    </script>
</body>
</html>
