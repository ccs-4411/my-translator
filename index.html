<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>google 雙向語音翻譯官</title>
    <style>
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; text-align: center; background: #f2f4f7; margin: 0; padding: 15px; }
        .card { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; margin-bottom: 20px; letter-spacing: 1px; }
        #status { font-size: 0.85rem; color: #888; margin-bottom: 10px; height: 1.2rem; font-weight: bold; }
        
        .select-container { display: flex; gap: 10px; margin-bottom: 20px; }
        select { flex: 1; padding: 15px; border-radius: 15px; border: 2px solid #eee; font-size: 1.1rem; outline: none; background: #fff; appearance: none; -webkit-appearance: none; }
        .add-btn { width: 55px; background: #e8f0fe; border: none; border-radius: 15px; color: #1a73e8; font-size: 1.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .btn-group { display: flex; gap: 15px; margin-bottom: 25px; }
        .mic-btn { flex: 1; height: 120px; border-radius: 25px; border: none; color: white; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #btn-me { background: #1a73e8; } 
        #btn-other { background: #34a853; }
        .mic-btn.active { background: #ea4335 !important; animation: pulse 1s infinite; }
        .mic-icon { font-size: 2.5rem; margin-bottom: 5px; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        #result-box { background: #f8f9fa; border-radius: 20px; padding: 20px; text-align: left; border: 1px solid #eee; min-height: 140px; }
        #original { color: #888; font-size: 0.95rem; margin-bottom: 10px; border-bottom: 1px dotted #ccc; padding-bottom: 10px; min-height: 1.2rem; }
        #translated { font-size: 1.6rem; font-weight: bold; color: #202124; line-height: 1.4; word-break: break-word; }

        /* 下拉彈窗式語言選單 */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 85%; max-width: 350px; border-radius: 25px; padding: 25px; max-height: 70vh; overflow-y: auto; text-align: left; }
        .modal-header { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #1a73e8; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; text-align: center; }
        .lang-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
        .lang-item:active { background: #f0f2f5; }
        .close-btn { margin-top: 15px; width: 100%; padding: 12px; border: none; border-radius: 12px; background: #eee; color: #555; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>google 語音翻譯官</h2>
    <div id="status">準備就緒</div>

    <div class="select-container">
        <select id="target" onchange="updateLabel()">
            <option value="英文" data-v="en-US">英文 English 🇺🇸</option>
            <option value="日文" data-v="ja-JP">日文 日本語 🇯🇵</option>
            <option value="韓文" data-v="ko-KR">韓文 한국어 🇰🇷</option>
            <option value="越南文" data-v="vi-VN">越南文 Tiếng Việt 🇻🇳</option>
            <option value="西班牙文" data-v="es-ES">西班牙文 Español 🇪🇸</option>
            <option value="泰文" data-v="th-TH">泰文 ภาษาไทย 🇹🇭</option>
        </select>
        <button class="add-btn" onclick="toggleModal(true)">＋</button>
    </div>

    <div class="btn-group">
        <button id="btn-me" class="mic-btn" onclick="runMic('me')">
            <span class="mic-icon">🎤</span><span>我講中文</span>
        </button>
        <button id="btn-other" class="mic-btn" onclick="runMic('other')">
            <span class="mic-icon">🎧</span><span>對方講<span id="target-name">英文</span></span>
        </button>
    </div>

    <div id="result-box">
        <div id="original">...</div>
        <div id="translated">翻譯結果</div>
    </div>
</div>

<div id="modal" onclick="toggleModal(false)">
    <div class="modal-body" onclick="event.stopPropagation()">
        <div class="modal-header">新增翻譯語言</div>
        <div id="lang-list"></div>
        <button class="close-btn" onclick="toggleModal(false)">取消</button>
    </div>
</div>

<script>
    const extraLangs = {
        "法文": { v: "fr-FR", e: "🇫🇷" },
        "德文": { v: "de-DE", e: "🇩🇪" },
        "俄文": { v: "ru-RU", e: "🇷🇺" },
        "印尼文": { v: "id-ID", e: "🇮🇩" },
        "義大利文": { v: "it-IT", e: "🇮🇹" },
        "菲律賓文": { v: "tl-PH", e: "🇵🇭" }
    };

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = false;
    recognition.interimResults = false;
    let currentMode = 'me';

    function updateLabel() {
        document.getElementById('target-name').innerText = document.getElementById('target').value;
    }

    function toggleModal(show) {
        const m = document.getElementById('modal');
        m.style.display = show ? 'flex' : 'none';
        if(show) {
            const list = document.getElementById('lang-list');
            list.innerHTML = '';
            for(let name in extraLangs) {
                let div = document.createElement('div');
                div.className = 'lang-item';
                div.innerHTML = `<span>${extraLangs[name].e} ${name}</span> <span>➔</span>`;
                div.onclick = () => addLang(name);
                list.appendChild(div);
            }
        }
    }

    function addLang(name) {
        const sel = document.getElementById('target');
        let exists = false;
        for(let opt of sel.options) { if(opt.value === name) { exists = true; break; } }
        
        if(!exists) {
            let opt = document.createElement('option');
            opt.value = name;
            opt.innerText = `${name} ${extraLangs[name].e}`;
            opt.setAttribute('data-v', extraLangs[name].v);
            sel.appendChild(opt);
        }
        sel.value = name;
        updateLabel();
        toggleModal(false);
    }

    recognition.onstart = () => {
        document.getElementById(currentMode === 'me' ? 'btn-me' : 'btn-other').classList.add('active');
        document.getElementById('status').innerText = "聆聽中...請說話";
    };

    recognition.onend = () => {
        document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
    };

    recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript.trim();
        if(!text) return;
        
        document.getElementById('original').innerText = text;
        document.getElementById('status').innerText = "分析與翻譯中...";

        const target = document.getElementById('target').value;
        try {
            const res = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, target, mode: currentMode })
            });
            const data = await res.json();
            document.getElementById('translated').innerText = data.translatedText;

            const sel = document.getElementById('target');
            const vCode = currentMode === 'me' ? sel.options[sel.selectedIndex].getAttribute('data-v') : 'zh-TW';
            speak(data.translatedText, vCode);
        } catch(err) {
            document.getElementById('translated').innerText = "翻譯失敗，請檢查網路";
        }
    };

    function speak(txt, lang) {
        window.speechSynthesis.cancel();
        setTimeout(() => {
            const msg = new SpeechSynthesisUtterance(txt);
            msg.lang = lang;
            msg.rate = 1.0;
            window.speechSynthesis.speak(msg);
            document.getElementById('status').innerText = "準備就緒";
        }, 200);
    }

    function runMic(mode) {
        // 先解除音訊鎖定
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
        currentMode = mode;
        const sel = document.getElementById('target');
        // 設定辨識語言：我講話用中文，對方講話用選單語言
        recognition.lang = mode === 'me' ? 'zh-TW' : sel.options[sel.selectedIndex].getAttribute('data-v');
        
        try { recognition.start(); } catch(e) { recognition.stop(); }
    }
    updateLabel();
</script>
</body>
</html>
