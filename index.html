<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 雙向語音翻譯官</title>
    <style>
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 15px; }
        .card { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 12px 40px rgba(0,0,0,0.15); }
        h2 { color: #1a73e8; margin-bottom: 15px; }
        #status { font-size: 0.9rem; color: #666; margin-bottom: 10px; height: 1.2rem; }
        select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 2px solid #eee; font-size: 1.1rem; background: #fff; -webkit-appearance: none; }
        .btn-group { display: flex; gap: 15px; margin: 25px 0; }
        .mic-btn { flex: 1; height: 120px; border-radius: 25px; border: none; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; transition: 0.2s; }
        #btn-me { background: #1a73e8; } 
        #btn-other { background: #34a853; }
        .mic-btn:active { transform: scale(0.95); opacity: 0.8; }
        .mic-btn.active { background: #ea4335 !important; animation: pulse 1s infinite; }
        .mic-icon { font-size: 2.5rem; margin-bottom: 5px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #result-box { background: #f8f9fa; border-radius: 20px; padding: 20px; text-align: left; border: 1px solid #eef; min-height: 150px; }
        #original { color: #888; font-size: 0.9rem; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 10px; min-height: 1.2rem; }
        #translated { font-size: 1.7rem; font-weight: bold; color: #202124; line-height: 1.3; word-break: break-word; }
    </style>
</head>
<body>

<div class="card">
    <h2>雙向翻譯官</h2>
    <div id="status">準備就緒</div>

    <select id="target" onchange="updateUI()">
        <option value="英文" data-v="en-US">英文 English 🇺🇸</option>
        <option value="日文" data-v="ja-JP">日文 日本語 🇯🇵</option>
        <option value="韓文" data-v="ko-KR">韓文 한국어 🇰🇷</option>
        <option value="越南文" data-v="vi-VN">越南文 Tiếng Việt 🇻🇳</option>
        <option value="西班牙文" data-v="es-ES">西班牙文 Español 🇪🇸</option>
        <option value="泰文" data-v="th-TH">泰文 ภาษาไทย 🇹🇭</option>
    </select>

    <div class="btn-group">
        <button id="btn-me" class="mic-btn" onclick="startRecognition('me')">
            <span class="mic-icon">🎤</span>
            <span>我講中文</span>
        </button>
        <button id="btn-other" class="mic-btn" onclick="startRecognition('other')">
            <span class="mic-icon">🎧</span>
            <span>對方講<span id="target-label">英文</span></span>
        </button>
    </div>

    <div id="result-box">
        <div id="original">等待辨識...</div>
        <div id="translated">翻譯結果</div>
    </div>
</div>

<script>
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = false;
    recognition.interimResults = false;

    let currentMode = 'me';

    function updateUI() {
        document.getElementById('target-label').innerText = document.getElementById('target').value;
    }

    recognition.onstart = () => {
        const btnId = currentMode === 'me' ? 'btn-me' : 'btn-other';
        document.getElementById(btnId).classList.add('active');
        document.getElementById('status').innerText = "正在聆聽...";
    };

    recognition.onend = () => {
        document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('status').innerText = "處理中...";
    };

    recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('original').innerText = text;
        doTranslate(text);
    };

    async function doTranslate(text) {
        const target = document.getElementById('target').value;
        try {
            const response = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, target, mode: currentMode })
            });
            const data = await response.json();
            const result = data.translatedText;
            
            document.getElementById('translated').innerText = result;
            document.getElementById('status').innerText = "播放語音...";

            const targetSelect = document.getElementById('target');
            const voiceCode = currentMode === 'me' ? 
                targetSelect.options[targetSelect.selectedIndex].getAttribute('data-v') : 'zh-TW';
            
            speak(result, voiceCode);
        } catch (e) {
            document.getElementById('translated').innerText = "連線失敗";
            document.getElementById('status').innerText = "錯誤";
        }
    }

    // 播放語音函式
    function speak(text, lang) {
        window.speechSynthesis.cancel(); // 先停止之前的聲音
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = lang;
        msg.rate = 1.0;
        msg.pitch = 1.0;
        
        // 針對 iOS 的修正：確保語音在完成時更新狀態
        msg.onend = () => { document.getElementById('status').innerText = "完成"; };
        window.speechSynthesis.speak(msg);
    }

    function startRecognition(mode) {
        // 重要：在用戶點擊按鈕的瞬間先解鎖音訊
        window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
        
        currentMode = mode;
        const targetSelect = document.getElementById('target');
        recognition.lang = mode === 'me' ? 'zh-TW' : targetSelect.options[targetSelect.selectedIndex].getAttribute('data-v');
        
        try {
            recognition.start();
        } catch (e) {
            recognition.stop();
            setTimeout(() => recognition.start(), 200);
        }
    }

    updateUI();
</script>
</body>
</html>
</body>
</html>
