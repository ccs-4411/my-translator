<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA & iOS 支援 -->
    <title>語音翻譯官</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="語音翻譯">
    <link rel="apple-touch-icon" href="/static/icon-192.png">

    <style>
        body { font-family: -apple-system, sans-serif; background:#f2f4f7; margin:0; padding:15px; text-align:center; }
        .card { max-width:450px; margin:auto; background:white; padding:25px; border-radius:30px; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
        h2 { color:#1a73e8; margin-top:0; }
        #status { font-size:0.85rem; color:#888; margin-bottom:10px; height: 1.2em; }
        select { width:100%; padding:14px; border-radius:15px; border:2px solid #eee; font-size:1.1rem; margin-bottom:10px; appearance: none; background: white; }
        .btn-group { display:flex; gap:10px; margin:20px 0; }
        .mic-btn { flex:1; height:110px; border:none; border-radius:25px; color:white; font-size:1.1rem; cursor:pointer; transition: 0.3s; }
        #btn-me { background:#1a73e8; }
        #btn-other { background:#34a853; }
        .active { background:#ea4335 !important; transform: scale(0.95); opacity: 0.8; }
        #result-box { background:#f8f9fa; border-radius:20px; padding:15px; text-align:left; min-height: 100px; }
        #original { color:#888; border-bottom:1px dotted #ccc; padding-bottom:5px; font-size:0.9rem; }
        #translated { font-size:1.4rem; font-weight:bold; margin-top:10px; color:#333; }
    </style>
</head>
<body>

<div class="card">
    <h2>語音翻譯官</h2>
    <div id="status">準備就緒</div>
    <select id="target"></select>

    <div class="btn-group">
        <button id="btn-me" class="mic-btn" onclick="runMic('me')">🎤 我講中文</button>
        <button id="btn-other" class="mic-btn" onclick="runMic('other')">🎧 對方講 <span id="target-name"></span></button>
    </div>

    <div id="result-box">
        <div id="original">等待說話...</div>
        <div id="translated">翻譯結果</div>
    </div>
</div>

<script>
let voices = [];
const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.continuous = false;

// 1. 解鎖語音 (iOS PWA 關鍵)
function unlockAudio() {
    const u = new SpeechSynthesisUtterance("");
    window.speechSynthesis.speak(u);
}
document.addEventListener("click", unlockAudio, { once: true });

// 2. 載入語音人
function loadVoices() {
    voices = window.speechSynthesis.getVoices();
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

// 3. 語言選單
async function init() {
    try {
        const res = await fetch("/languages");
        const langs = await res.json();
        const sel = document.getElementById("target");
        
        langs.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.name;
            opt.textContent = `${l.name} ${l.label}`;
            opt.dataset.v = l.voice;
            sel.appendChild(opt);
        });

        const saved = localStorage.getItem("targetLang");
        if (saved) sel.value = saved;
        sync();
    } catch(e) { console.error("載入失敗", e); }
}

function sync() {
    const sel = document.getElementById("target");
    document.getElementById("target-name").innerText = sel.value;
    localStorage.setItem("targetLang", sel.value);
}
document.getElementById("target").addEventListener("change", sync);

// 4. 語音辨識
function runMic(mode) {
    unlockAudio();
    const sel = document.getElementById("target");
    const isMe = (mode === "me");
    
    recognition.lang = isMe ? "zh-TW" : sel.selectedOptions[0].dataset.v;
    
    // UI 反饋
    document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(isMe ? 'btn-me' : 'btn-other').classList.add('active');
    document.getElementById("status").innerText = "🎤 聆聽中...";

    try {
        recognition.start();
    } catch(e) {
        recognition.stop();
        document.getElementById("status").innerText = "請再點一次";
    }
}

recognition.onresult = async (e) => {
    const text = e.results[0][0].transcript;
    document.getElementById("original").innerText = text;
    document.getElementById("status").innerText = "🔄 翻譯中...";

    const sel = document.getElementById("target");
    const isMe = (recognition.lang === "zh-TW");

    try {
        const res = await fetch("/translate", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
                text: text,
                target: sel.value,
                mode: isMe ? "me" : "other"
            })
        });
        const data = await res.json();
        document.getElementById("translated").innerText = data.translatedText;
        document.getElementById("status").innerText = "✅ 完成";

        // 決定播放語系
        const playLang = isMe ? sel.selectedOptions[0].dataset.v : "zh-TW";
        speak(data.translatedText, playLang);
    } catch (err) {
        document.getElementById("status").innerText = "❌ 翻譯出錯";
    }
};

recognition.onend = () => {
    document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
};

// 5. 語音播放
function speak(text, lang) {
    window.speechSynthesis.cancel();
    if (voices.length === 0) voices = window.speechSynthesis.getVoices();

    setTimeout(() => {
        const msg = new SpeechSynthesisUtterance(text);
        const voice = voices.find(v => v.lang.replace('_','-') === lang) || 
                      voices.find(v => v.lang.startsWith(lang.split('-')[0]));
        if (voice) msg.voice = voice;
        msg.lang = lang;
        window.speechSynthesis.speak(msg);
    }, 100);
}

init();
</script>
</body>
</html>
loadLanguages();
</script>
</body>
</html>
