<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI OCR 相機翻譯</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
    margin:0;
    padding:15px;
    background:#f2f4f7;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    text-align:center;
}

.card{
    max-width:520px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2{
    color:#1a73e8;
    margin-top:0;
}

#status{
    color:#1a73e8;
    font-weight:bold;
    margin-bottom:15px;
    min-height:1.4em;
}

video{
    width:100%;
    border-radius:20px;
    background:black;
}

canvas{
    display:none;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

button{
    flex:1;
    min-width:120px;
    border:none;
    border-radius:15px;
    padding:15px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

#cameraBtn{
    background:#1a73e8;
}

#scanBtn{
    background:#34a853;
}

#speakBtn{
    background:#ff9800;
}

#stopBtn{
    background:#ea4335;
}

select{
    width:100%;
    padding:14px;
    border-radius:15px;
    border:2px solid #eee;
    font-size:1rem;
    margin-bottom:15px;
}

.result-box{
    margin-top:20px;
    background:#f8f9fa;
    border-radius:20px;
    padding:15px;
    text-align:left;
}

.label{
    color:#888;
    font-size:0.9rem;
    margin-bottom:5px;
}

#ocrText{
    min-height:60px;
    white-space:pre-wrap;
    font-size:1rem;
    color:#444;
}

#translatedText{
    margin-top:10px;
    font-size:1.5rem;
    font-weight:bold;
    color:#111;
    white-space:pre-wrap;
}

.tip{
    margin-top:10px;
    font-size:0.85rem;
    color:#777;
}

</style>
</head>

<body>

<div class="card">

    <h2>📷 AI OCR 相機翻譯</h2>

    <div id="status">
        等待開啟相機
    </div>

    <select id="targetLang">

        <option value="中文">中文</option>
        <option value="英文">英文 English</option>
        <option value="日文">日文 日本語</option>
        <option value="韓文">韓文 한국어</option>
        <option value="越南文">越南文</option>
        <option value="泰文">泰文</option>

    </select>

    <video
        id="video"
        autoplay
        playsinline
    ></video>

    <canvas id="canvas"></canvas>

    <div class="controls">

        <button id="cameraBtn">
            📷 開啟相機
        </button>

        <button id="scanBtn">
            🔍 掃描翻譯
        </button>

        <button id="speakBtn">
            🔊 念出翻譯
        </button>

        <button id="stopBtn">
            ⛔ 停止
        </button>

    </div>

    <div class="tip">
        建議使用 HTTPS 網站或 localhost
    </div>

    <div class="result-box">

        <div class="label">
            OCR 辨識結果
        </div>

        <div id="ocrText">
            等待掃描...
        </div>

        <hr>

        <div class="label">
            翻譯結果
        </div>

        <div id="translatedText">
            尚未翻譯
        </div>

    </div>

</div>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const statusDiv =
    document.getElementById("status");

const ocrTextDiv =
    document.getElementById("ocrText");

const translatedDiv =
    document.getElementById("translatedText");

let lastTranslated = "";

let isScanning = false;

// ========================
// 開啟相機
// ========================
async function startCamera(){

    try{

        statusDiv.innerText =
            "📷 開啟相機中...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"environment"
                },

                audio:false

            });

        video.srcObject = stream;

        statusDiv.innerText =
            "✅ 相機已開啟";

    }catch(err){

        console.error(err);

        statusDiv.innerText =
            "⚠️ 無法開啟相機";

        alert(
            "請確認：\n\n1. 已允許相機權限\n2. 使用 HTTPS 網站\n3. 瀏覽器支援 getUserMedia"
        );
    }
}

// ========================
// 擷取畫面
// ========================
function captureFrame(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas;
}

// ========================
// OCR 掃描
// ========================
async function scanText(){

    if(isScanning) return;

    if(!video.srcObject){

        statusDiv.innerText =
            "⚠️ 請先開啟相機";

        return;
    }

    isScanning = true;

    translatedDiv.innerText = "";
    ocrTextDiv.innerText = "";

    statusDiv.innerText =
        "🔍 OCR 辨識中...";

    try{

        const image =
            captureFrame();

        const result =
            await Tesseract.recognize(

                image,

                "chi_tra+jpn+eng+kor",

                {

                    logger:m=>{

                        if(
                            m.status ===
                            "recognizing text"
                        ){

                            statusDiv.innerText =
                                `🔍 OCR 辨識中 ${Math.floor(m.progress*100)}%`;
                        }
                    }
                }
            );

        const text =
            result.data.text.trim();

        if(!text){

            ocrTextDiv.innerText =
                "⚠️ 沒有辨識到文字";

            translatedDiv.innerText =
                "";

            statusDiv.innerText =
                "完成";

            isScanning = false;
            return;
        }

        ocrTextDiv.innerText =
            text;

        statusDiv.innerText =
            "🌐 翻譯中...";

        await translateText(text);

    }catch(err){

        console.error(err);

        statusDiv.innerText =
            "⚠️ OCR 失敗";

    }

    isScanning = false;
}

// ========================
// 翻譯
// ========================
async function translateText(text){

    try{

        const target =
            document.getElementById("targetLang").value;

        const controller =
            new AbortController();

        setTimeout(()=>{

            controller.abort();

        },15000);

        const res =
            await fetch("/translate",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                signal:controller.signal,

                body:JSON.stringify({

                    text:text,
                    target:target,
                    mode:"other"

                })

            });

        const data =
            await res.json();

        if(!data.translatedText){

            translatedDiv.innerText =
                "⚠️ 翻譯失敗";

            statusDiv.innerText =
                "翻譯失敗";

            return;
        }

        translatedDiv.innerText =
            data.translatedText;

        lastTranslated =
            data.translatedText;

        statusDiv.innerText =
            "✅ 翻譯完成";

    }catch(err){

        console.error(err);

        translatedDiv.innerText =
            "⚠️ 翻譯失敗";

        statusDiv.innerText =
            "翻譯失敗";
    }
}

// ========================
// 語音播放
// ========================
async function speakText(){

    if(!lastTranslated){

        statusDiv.innerText =
            "⚠️ 沒有可播放內容";

        return;
    }

    if(speechSynthesis.speaking){

        speechSynthesis.cancel();

        await new Promise(r=>
            setTimeout(r,150)
        );
    }

    const msg =
        new SpeechSynthesisUtterance(
            lastTranslated
        );

    msg.lang = "zh-TW";

    setTimeout(()=>{

        speechSynthesis.speak(msg);

    },120);

    statusDiv.innerText =
        "🔊 播放中...";
}

// ========================
// 停止播放
// ========================
function stopSpeak(){

    speechSynthesis.cancel();

    statusDiv.innerText =
        "⛔ 已停止";
}

// ========================
// 按鈕事件
// ========================
document
    .getElementById("cameraBtn")
    .addEventListener(
        "click",
        startCamera
    );

document
    .getElementById("scanBtn")
    .addEventListener(
        "click",
        scanText
    );

document
    .getElementById("speakBtn")
    .addEventListener(
        "click",
        speakText
    );

document
    .getElementById("stopBtn")
    .addEventListener(
        "click",
        stopSpeak
    );

</script>

</body>
</html>
