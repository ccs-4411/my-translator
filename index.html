<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 語音 + OCR 翻譯官</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f2f4f7;
    margin:0;
    padding:15px;
    text-align:center;
}

.card{
    max-width:520px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2{
    color:#1a73e8;
    margin-top:0;
}

.top-menu{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.top-menu button{
    flex:1;
    border:none;
    border-radius:15px;
    padding:14px;
    background:#1a73e8;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#status{
    font-size:0.95rem;
    color:#1a73e8;
    margin-bottom:12px;
    font-weight:bold;
    min-height:1.2em;
}

select{
    width:100%;
    padding:14px;
    border-radius:15px;
    border:2px solid #eee;
    font-size:1rem;
    margin-bottom:10px;
}

.btn-group{
    display:flex;
    gap:12px;
    margin:20px 0;
}

.mic-btn{
    flex:1;
    height:120px;
    border:none;
    border-radius:25px;
    color:white;
    font-size:1.2rem;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

#btn-me{
    background:#1a73e8;
}

#btn-other{
    background:#34a853;
}

.active{
    background:#ea4335 !important;
    transform:scale(0.97);
}

#result-box{
    background:#f8f9fa;
    border-radius:20px;
    padding:18px;
    text-align:left;
    min-height:120px;
}

#original{
    color:#888;
    border-bottom:1px solid #eee;
    padding-bottom:8px;
    font-size:1rem;
    white-space:pre-wrap;
}

#translated{
    font-size:1.6rem;
    font-weight:bold;
    margin-top:12px;
    color:#111;
    white-space:pre-wrap;
}

.play-group{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.play-btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:15px;
    color:white;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
}

#replay-btn{
    background:#ff9800;
}

#ocrPage{
    display:none;
}

video{
    width:100%;
    border-radius:20px;
    background:black;
    margin-top:10px;
}

canvas{
    display:none;
}

.ocr-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.ocr-buttons button{
    flex:1;
    border:none;
    border-radius:15px;
    padding:14px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#cameraBtn{
    background:#1a73e8;
}

#scanBtn{
    background:#34a853;
}

#ocrSpeakBtn{
    background:#ff9800;
}

#stopBtn{
    background:#ea4335;
}

.tip{
    margin-top:10px;
    color:#777;
    font-size:0.85rem;
}

</style>
</head>

<body>

<div class="card">

    <h2>AI 翻譯官</h2>

    <!-- 模式切換 -->
    <div class="top-menu">

        <button onclick="showVoicePage()">
            🎤 語音翻譯
        </button>

        <button onclick="showOCRPage()">
            📷 掃描翻譯
        </button>

    </div>

    <div id="status">
        準備就緒
    </div>

    <!-- ========================= -->
    <!-- 語音翻譯頁 -->
    <!-- ========================= -->
    <div id="voicePage">

        <select id="target"></select>

        <div class="btn-group">

            <button id="btn-me"
                    class="mic-btn"
                    onclick="runMic('me')">

                🎤 我講中文

            </button>

            <button id="btn-other"
                    class="mic-btn"
                    onclick="runMic('other')">

                🎧 對方講

            </button>

        </div>

        <div id="result-box">

            <div id="original">
                等待說話...
            </div>

            <div id="translated">
                翻譯結果
            </div>

            <div class="play-group">

                <button id="replay-btn"
                        class="play-btn"
                        onclick="replayAudio()">

                    🔊 重播

                </button>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- OCR 掃描頁 -->
    <!-- ========================= -->
    <div id="ocrPage">

        <video
            id="video"
            autoplay
            playsinline
        ></video>

        <canvas id="canvas"></canvas>

        <div class="ocr-buttons">

            <button id="cameraBtn">
                📷 開啟相機
            </button>

            <button id="scanBtn">
                🔍 掃描
            </button>

        </div>

        <div class="ocr-buttons">

            <button id="ocrSpeakBtn">
                🔊 念出翻譯
            </button>

            <button id="stopBtn">
                ⛔ 停止
            </button>

        </div>

        <div class="tip">
            建議使用 HTTPS 網站
        </div>

    </div>

</div>

<script>

// ============================
// 全域
// ============================

let recognition = null;
let isProcessing = false;
let VOICES = [];
let audioUnlocked = false;

let lastSpeakText = "";
let lastSpeakLang = "zh-TW";

let isScanning = false;

// OCR
const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

// ============================
// 模式切換
// ============================
function showVoicePage(){

    document.getElementById("voicePage")
        .style.display = "block";

    document.getElementById("ocrPage")
        .style.display = "none";

    document.getElementById("status")
        .innerText = "語音翻譯模式";
}

function showOCRPage(){

    document.getElementById("voicePage")
        .style.display = "none";

    document.getElementById("ocrPage")
        .style.display = "block";

    document.getElementById("status")
        .innerText = "OCR 掃描翻譯模式";
}

// ============================
// 語音
// ============================
function loadVoices(){

    return new Promise(resolve=>{

        let voices =
            speechSynthesis.getVoices();

        if(voices.length){
            return resolve(voices);
        }

        speechSynthesis.onvoiceschanged=()=>{

            resolve(
                speechSynthesis.getVoices()
            );
        };

    });
}

async function initSpeech(){

    VOICES = await loadVoices();
}

document.body.addEventListener("click",()=>{

    if(!audioUnlocked){

        speechSynthesis.speak(
            new SpeechSynthesisUtterance("")
        );

        audioUnlocked = true;
    }

},{once:true});

// ============================
// 語言
// ============================
async function initLangs(){

    try{

        const res =
            await fetch("/languages?v="+Date.now());

        const langs =
            await res.json();

        const sel =
            document.getElementById("target");

        sel.innerHTML = "";

        langs.forEach(l=>{

            const opt =
                document.createElement("option");

            opt.value = l.name;

            opt.textContent =
                `${l.name} ${l.label}`;

            opt.dataset.v = l.voice;

            sel.appendChild(opt);

        });

        const saved =
            localStorage.getItem("targetLang");

        if(saved){
            sel.value = saved;
        }

        sync();

    }catch(e){

        document.getElementById("status")
            .innerText = "語言載入失敗";
    }
}

function sync(){

    const sel =
        document.getElementById("target");

    localStorage.setItem(
        "targetLang",
        sel.value
    );
}

document
    .getElementById("target")
    .addEventListener("change",sync);

// ============================
// 語音辨識
// ============================
function initRecognition(){

    const Speech =
        window.webkitSpeechRecognition ||
        window.SpeechRecognition;

    if(!Speech){

        document.getElementById("status")
            .innerText = "不支援語音";

        return;
    }

    recognition = new Speech();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.onresult = (e)=>{

        const text =
            e.results[0][0].transcript;

        document.getElementById("original")
            .innerText = text;

        handleTranslation(text);
    };

    recognition.onerror = (e)=>{

        console.log(e.error);

        document.getElementById("status")
            .innerText = "⚠️ 語音辨識失敗";

        resetUI();
    };

    recognition.onend = ()=>{

        if(!isProcessing){
            resetUI();
        }
    };
}

// ============================
// 麥克風
// ============================
function runMic(mode){

    if(isProcessing) return;

    speechSynthesis.cancel();

    if(!recognition){
        initRecognition();
    }

    const sel =
        document.getElementById("target");

    const isMe =
        (mode === "me");

    recognition.lang =
        isMe
        ? "zh-TW"
        : sel.selectedOptions[0].dataset.v;

    document
        .querySelectorAll(".mic-btn")
        .forEach(b=>b.classList.remove("active"));

    document
        .getElementById(
            isMe ? "btn-me" : "btn-other"
        )
        .classList.add("active");

    try{
        recognition.abort();
    }catch(e){}

    setTimeout(()=>{

        try{

            recognition.start();

            document.getElementById("status")
                .innerText = "🎤 聆聽中...";

        }catch(err){

            document.getElementById("status")
                .innerText =
                "⚠️ 無法啟動語音辨識";
        }

    },300);
}

// ============================
// 翻譯
// ============================
async function handleTranslation(text){

    isProcessing = true;

    document.getElementById("status")
        .innerText = "翻譯中...";

    const sel =
        document.getElementById("target");

    const isMe =
        (recognition.lang === "zh-TW");

    try{

        const res =
            await fetch("/translate",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    text,
                    target:sel.value,
                    mode:isMe ? "me":"other"

                })

            });

        const data =
            await res.json();

        if(!data.translatedText){

            document.getElementById("translated")
                .innerText = "⚠️ 無法翻譯";

            isProcessing = false;
            return;
        }

        document.getElementById("translated")
            .innerText = data.translatedText;

        const playLang =
            isMe
            ? sel.selectedOptions[0].dataset.v
            : "zh-TW";

        speak(data.translatedText,playLang);

        document.getElementById("status")
            .innerText = "完成";

    }catch(err){

        document.getElementById("translated")
            .innerText = "⚠️ 翻譯失敗";

        document.getElementById("status")
            .innerText = "翻譯失敗";
    }

    isProcessing = false;
}

// ============================
// 語音播放
// ============================
async function speak(text,lang){

    lastSpeakText = text;
    lastSpeakLang = lang;

    if(speechSynthesis.speaking){

        speechSynthesis.cancel();

        await new Promise(r=>
            setTimeout(r,150)
        );
    }

    if(!VOICES.length){

        VOICES =
            speechSynthesis.getVoices();
    }

    const msg =
        new SpeechSynthesisUtterance(text);

    const voice =

        VOICES.find(v=>
            v.lang.replace('_','-')===lang
        )

        ||

        VOICES.find(v=>
            v.lang.startsWith(
                lang.split('-')[0]
            )
        );

    if(voice){
        msg.voice = voice;
    }

    msg.lang = lang;

    setTimeout(()=>{

        speechSynthesis.speak(msg);

    },120);
}

function replayAudio(){

    if(!lastSpeakText){

        document.getElementById("status")
            .innerText = "沒有可重播內容";

        return;
    }

    speak(lastSpeakText,lastSpeakLang);

    document.getElementById("status")
        .innerText = "🔊 重播中...";
}

function resetUI(){

    document
        .querySelectorAll(".mic-btn")
        .forEach(b=>b.classList.remove("active"));
}

// ============================
// OCR 相機
// ============================
async function startCamera(){

    try{

        document.getElementById("status")
            .innerText = "📷 開啟相機中...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"environment"
                },

                audio:false

            });

        video.srcObject = stream;

        document.getElementById("status")
            .innerText = "✅ 相機已開啟";

    }catch(err){

        console.error(err);

        document.getElementById("status")
            .innerText = "⚠️ 無法開啟相機";
    }
}

function captureFrame(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas;
}

async function scanText(){

    if(isScanning) return;

    if(!video.srcObject){

        document.getElementById("status")
            .innerText = "⚠️ 請先開啟相機";

        return;
    }

    isScanning = true;

    document.getElementById("original")
        .innerText = "";

    document.getElementById("translated")
        .innerText = "";

    document.getElementById("status")
        .innerText = "🔍 OCR 辨識中...";

    try{

        const image =
            captureFrame();

        const result =
            await Tesseract.recognize(

                image,

                "chi_tra+jpn+eng+kor",

                {

                    logger:m=>{

                        if(
                            m.status==="recognizing text"
                        ){

                            document.getElementById("status")
                                .innerText =
                                `🔍 OCR ${Math.floor(m.progress*100)}%`;
                        }
                    }
                }
            );

        const text =
            result.data.text.trim();

        if(!text){

            document.getElementById("original")
                .innerText = "⚠️ 沒有辨識到文字";

            document.getElementById("status")
                .innerText = "完成";

            isScanning = false;
            return;
        }

        document.getElementById("original")
            .innerText = text;

        await handleOCRTranslation(text);

    }catch(err){

        console.error(err);

        document.getElementById("status")
            .innerText = "⚠️ OCR 失敗";
    }

    isScanning = false;
}

async function handleOCRTranslation(text){

    document.getElementById("status")
        .innerText = "🌐 翻譯中...";

    try{

        const sel =
            document.getElementById("target");

        const res =
            await fetch("/translate",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    text,
                    target:sel.value,
                    mode:"other"

                })

            });

        const data =
            await res.json();

        if(!data.translatedText){

            document.getElementById("translated")
                .innerText = "⚠️ 翻譯失敗";

            return;
        }

        document.getElementById("translated")
            .innerText = data.translatedText;

        lastSpeakText =
            data.translatedText;

        lastSpeakLang = "zh-TW";

        document.getElementById("status")
            .innerText = "✅ 翻譯完成";

    }catch(err){

        document.getElementById("translated")
            .innerText = "⚠️ 翻譯失敗";

        document.getElementById("status")
            .innerText = "翻譯失敗";
    }
}

// ============================
// OCR 按鈕
// ============================
document
    .getElementById("cameraBtn")
    .addEventListener(
        "click",
        startCamera
    );

document
    .getElementById("scanBtn")
    .addEventListener(
        "click",
        scanText
    );

document
    .getElementById("ocrSpeakBtn")
    .addEventListener(
        "click",
        ()=>speak(
            lastSpeakText,
            "zh-TW"
        )
    );

document
    .getElementById("stopBtn")
    .addEventListener(
        "click",
        ()=>speechSynthesis.cancel()
    );

// ============================
// INIT
// ============================
initSpeech();
initLangs();
initRecognition();

</script>

</body>
</html>
