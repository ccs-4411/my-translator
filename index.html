<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 多國雙向翻譯</title>
    <style>
        :root { --primary: #4A90E2; --secondary: #34A853; }
        body { font-family: -apple-system, sans-serif; text-align: center; background-color: #f8f9fa; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .setup-box { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; font-weight: bold; }
        select { padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 1rem; }
        .mode-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 15px; border: 3px solid #eee; border-radius: 12px; background: white; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { border-color: var(--primary); background: #eef6ff; color: var(--primary); }
        .mode-btn.other-active { border-color: var(--secondary); background: #e6f4ea; color: var(--secondary); }
        #micBtn { 
            background-color: var(--primary); color: white; border: none; padding: 25px; 
            border-radius: 50%; font-size: 2.5rem; cursor: pointer; width: 100px; height: 100px; 
            margin: 15px 0; box-shadow: 0 6px 20px rgba(74,144,226,0.3);
        }
        #micBtn.recording { background-color: #ea4335; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #translated-text { font-size: 2.2rem; color: #333; margin: 15px 0; font-weight: bold; line-height: 1.2; min-height: 2.6rem; }
        #original-text { color: #888; font-size: 1rem; font-style: italic; }
        #status { color: var(--primary); font-weight: bold; margin-bottom: 10px; }
        .play-btn { background: #f1f3f4; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div id="status">準備就緒</div>
        <div class="setup-box">
            <label>切換目標語言：</label>
            <select id="targetLang" onchange="updateLabels()">
                <option value="日文" data-code="ja-JP">日文 🇯🇵</option>
                <option value="英文" data-code="en-US">英文 🇺🇸</option>
                <option value="韓文" data-code="ko-KR">韓文 🇰🇷</option>
                <option value="法文" data-code="fr-FR">法文 🇫🇷</option>
            </select>
        </div>
        <div class="mode-selector">
            <button id="btn-me" class="mode-btn active" onclick="setDir('me')">我說中文<br>➔ <span class="lt">日文</span></button>
            <button id="btn-other" class="mode-btn" onclick="setDir('other')">對方說<span class="lt">日文</span><br>➔ 中文</button>
        </div>
        <button id="micBtn">🎤</button>
        <div id="original-text">等待語音...</div>
        <div id="translated-text">...</div>
        <button class="play-btn" onclick="replay()">🔊 重播聲音</button>
    </div>
    <script>
        let dir = 'me', lastText = "", recognition;
        const micBtn = document.getElementById('micBtn'), status = document.getElementById('status'),
              tDiv = document.getElementById('translated-text'), oDiv = document.getElementById('original-text'),
              tSel = document.getElementById('targetLang');

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.onstart = () => { micBtn.classList.add('recording'); status.innerText = "聆聽中..."; };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                oDiv.innerText = "偵測：" + text;
                doTrans(text);
            };
            recognition.onend = () => micBtn.classList.remove('recording');
        }

        function updateLabels() {
            document.querySelectorAll('.lt').forEach(el => el.innerText = tSel.value);
            setDir(dir);
        }

        function setDir(d) {
            dir = d;
            document.getElementById('btn-me').className = 'mode-btn ' + (d==='me'?'active':'');
            document.getElementById('btn-other').className = 'mode-btn ' + (d==='other'?'other-active':'');
            recognition.lang = (d==='me') ? 'zh-TW' : tSel.options[tSel.selectedIndex].getAttribute('data-code');
            micBtn.style.backgroundColor = (d==='me') ? "#4A90E2" : "#34A853";
        }

        micBtn.onclick = () => {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); // 喚醒 iOS 音訊
            try { recognition.start(); } catch(e) { recognition.stop(); }
        };

        async function doTrans(text) {
            status.innerText = "翻譯中...";
            const opt = tSel.options[tSel.selectedIndex];
            const target = (dir === 'me') ? opt.value : "中文";
            const vLang = (dir === 'me') ? opt.getAttribute('data-code') : "zh-TW";
            try {
                const res = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, target })
                });
                const data = await res.json();
                lastText = data.translatedText;
                tDiv.innerText = lastText;
                status.innerText = "翻譯完成";
                speak(lastText, vLang);
            } catch (err) { status.innerText = "連線失敗"; }
        }

        function speak(t, l) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = l; u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function replay() { if(lastText) speak(lastText, (dir==='me'?tSel.options[tSel.selectedIndex].getAttribute('data-code'):'zh-TW')); }
        updateLabels(); // 初始化
    </script>
</body>
</html>
