<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>語音翻譯官</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <style>
        body { font-family: -apple-system, sans-serif; background:#f2f4f7; margin:0; padding:15px; text-align:center; -webkit-user-select: none; }
        .card { max-width:450px; margin:auto; background:white; padding:25px; border-radius:30px; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
        h2 { color:#1a73e8; margin-top:0; }
        #status { font-size:0.9rem; color:#888; margin-bottom:12px; font-weight: bold; height: 1.2em; }
        select { width:100%; padding:14px; border-radius:15px; border:2px solid #eee; font-size:1.1rem; margin-bottom:10px; background:white; }
        .btn-group { display:flex; gap:12px; margin:20px 0; }
        .mic-btn { flex:1; height:120px; border:none; border-radius:25px; color:white; font-size:1.2rem; cursor:pointer; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        #btn-me { background:#1a73e8; }
        #btn-other { background:#34a853; }
        .active { background:#ea4335 !important; transform: scale(0.95); }
        #result-box { background:#f8f9fa; border-radius:20px; padding:18px; text-align:left; min-height: 120px; border: 1px solid #eee; }
        #original { color:#888; border-bottom:1px solid #eee; padding-bottom:8px; font-size:0.95rem; }
        #translated { font-size:1.5rem; font-weight:bold; margin-top:12px; color:#111; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="app-title">語音翻譯官</h2>
    <div id="status">準備就緒</div>
    <select id="target"></select>
    <div class="btn-group">
        <button id="btn-me" class="mic-btn" onclick="runMic('me')">🎤 我講中文</button>
        <button id="btn-other" class="mic-btn" onclick="runMic('other')">🎧 對方講 <span id="target-name"></span></button>
    </div>
    <div id="result-box">
        <div id="original">等待說話...</div>
        <div id="translated">翻譯結果</div>
    </div>
</div>

<script>
let voices = [];
const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
recognition.continuous = false;

// 1. 解決 iOS 語音鎖定的關鍵
function unlockAudio() {
    const silent = new SpeechSynthesisUtterance("");
    silent.volume = 0;
    window.speechSynthesis.speak(silent);
}

// 點擊標題也可以手動解鎖音訊
document.getElementById('app-title').onclick = () => {
    unlockAudio();
    const t = new SpeechSynthesisUtterance("測試中");
    window.speechSynthesis.speak(t);
};

function loadVoices() {
    voices = window.speechSynthesis.getVoices();
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

async function init() {
    try {
        const res = await fetch("/languages");
        const langs = await res.json();
        const sel = document.getElementById("target");
        langs.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.name;
            opt.textContent = `${l.name} ${l.label}`;
            opt.dataset.v = l.voice;
            sel.appendChild(opt);
        });
        const saved = localStorage.getItem("targetLang");
        if (saved) sel.value = saved;
        sync();
    } catch(e) { console.error(e); }
}

function sync() {
    const sel = document.getElementById("target");
    document.getElementById("target-name").innerText = sel.value;
    localStorage.setItem("targetLang", sel.value);
}
document.getElementById("target").addEventListener("change", sync);

function runMic(mode) {
    unlockAudio(); // 每次點擊都嘗試解鎖
    
    const sel = document.getElementById("target");
    const isMe = (mode === "me");
    recognition.lang = isMe ? "zh-TW" : sel.selectedOptions[0].dataset.v;
    
    document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(isMe ? 'btn-me' : 'btn-other').classList.add('active');
    document.getElementById("status").innerText = "🎤 聆聽中...";

    try { recognition.stop(); } catch(e) {}
    setTimeout(() => { recognition.start(); }, 200);
}

recognition.onresult = async (e) => {
    const text = e.results[0][0].transcript;
    document.getElementById("original").innerText = text;
    document.getElementById("status").innerText = "🔄 翻譯中...";
    const sel = document.getElementById("target");
    const isMe = (recognition.lang === "zh-TW");

    try {
        const res = await fetch("/translate", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ text, target: sel.value, mode: isMe ? "me" : "other" })
        });
        const data = await res.json();
        document.getElementById("translated").innerText = data.translatedText;
        document.getElementById("status").innerText = "✅ 完成";

        const playLang = isMe ? sel.selectedOptions[0].dataset.v : "zh-TW";
        speak(data.translatedText, playLang);
    } catch (err) {
        document.getElementById("status").innerText = "❌ 翻譯出錯";
    }
};

recognition.onend = () => {
    document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
};

// 2. 強化版發聲函式
function speak(text, lang) {
    window.speechSynthesis.cancel();
    
    const doSpeak = () => {
        const currentVoices = window.speechSynthesis.getVoices();
        if (currentVoices.length === 0) {
            setTimeout(doSpeak, 100);
            return;
        }

        const msg = new SpeechSynthesisUtterance(text);
        const voice = currentVoices.find(v => v.lang.replace('_','-') === lang) || 
                      currentVoices.find(v => v.lang.startsWith(lang.split('-')[0]));
        
        if (voice) msg.voice = voice;
        msg.lang = lang;
        msg.volume = 1.0;
        msg.rate = 1.0;
        
        // iOS 需要在微小延遲後播放
        setTimeout(() => {
            window.speechSynthesis.speak(msg);
        }, 60);
    };

    doSpeak();
}

init();
</script>
</body>
</html>
