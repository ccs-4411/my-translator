<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 多國雙向翻譯</title>
    <style>
        :root { --primary: #4A90E2; --secondary: #34A853; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background-color: #f0f2f5; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: 20px auto; background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .setup-box { margin-bottom: 20px; text-align: left; background: #f8f9fa; padding: 15px; border-radius: 15px; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 1rem; margin-top: 5px; }
        .mode-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 15px 10px; border: 3px solid #eee; border-radius: 15px; background: white; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 0.95rem; }
        .mode-btn.active { border-color: var(--primary); background: #eef6ff; color: var(--primary); }
        .mode-btn.other-active { border-color: var(--secondary); background: #e6f4ea; color: var(--secondary); }
        #micBtn { 
            background-color: var(--primary); color: white; border: none; padding: 25px; 
            border-radius: 50%; font-size: 3rem; cursor: pointer; width: 110px; height: 110px; 
            margin: 20px 0; box-shadow: 0 8px 25px rgba(74,144,226,0.4); outline: none;
        }
        #micBtn.recording { background-color: #ea4335; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        #translated-text { font-size: 2.2rem; color: #222; margin: 20px 0; font-weight: 800; line-height: 1.3; min-height: 3rem; }
        #original-text { color: #777; font-size: 1.1rem; min-height: 1.5rem; }
        #status { color: #999; font-size: 0.9rem; margin-bottom: 5px; }
        .play-btn { background: #eee; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div id="status">系統準備就緒</div>
        <div class="setup-box">
            <label>選擇翻譯目標語言：</label>
            <select id="targetLang" onchange="updateLabels()">
                <option value="日文" data-code="ja-JP">日文 🇯🇵</option>
                <option value="英文" data-code="en-US">英文 🇺🇸</option>
                <option value="韓文" data-code="ko-KR">韓文 🇰🇷</option>
                <option value="法文" data-code="fr-FR">法文 🇫🇷</option>
            </select>
        </div>
        <div class="mode-selector">
            <button id="btn-me" class="mode-btn active" onclick="setDir('me')">我說中文<br>➔ <span class="lt">日文</span></button>
            <button id="btn-other" class="mode-btn" onclick="setDir('other')">對方說<span class="lt">日文</span><br>➔ 中文</button>
        </div>
        <button id="micBtn">🎤</button>
        <div id="original-text">等待語音輸入...</div>
        <div id="translated-text">...</div>
        <button class="play-btn" onclick="replay()">🔊 重播聲音</button>
    </div>

    <script>
        let dir = 'me', lastText = "", recognition;
        const micBtn = document.getElementById('micBtn'), status = document.getElementById('status'),
              tDiv = document.getElementById('translated-text'), oDiv = document.getElementById('original-text'),
              tSel = document.getElementById('targetLang');

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => { micBtn.classList.add('recording'); status.innerText = "聆聽中..."; };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                oDiv.innerText = "偵測到：" + text;
                doTrans(text);
            };
            recognition.onend = () => { micBtn.classList.remove('recording'); status.innerText = "處理中..."; };
            recognition.onerror = (e) => { status.innerText = "語音辨識錯誤: " + e.error; micBtn.classList.remove('recording'); };
        } else {
            status.innerText = "您的瀏覽器不支援語音辨識";
        }

        function updateLabels() {
            document.querySelectorAll('.lt').forEach(el => el.innerText = tSel.value);
            setDir(dir);
        }

        function setDir(d) {
            dir = d;
            document.getElementById('btn-me').className = 'mode-btn ' + (d==='me'?'active':'');
            document.getElementById('btn-other').className = 'mode-btn ' + (d==='other'?'other-active':'');
            recognition.lang = (d==='me') ? 'zh-TW' : tSel.options[tSel.selectedIndex].getAttribute('data-code');
            micBtn.style.backgroundColor = (d==='me') ? "#4A90E2" : "#34A853";
        }

        micBtn.onclick = () => {
            // 點擊瞬間喚醒 iOS 音訊
            const s = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(s);
            try { recognition.start(); } catch(e) { recognition.stop(); }
        };

        async function doTrans(text) {
            const opt = tSel.options[tSel.selectedIndex];
            const target = (dir === 'me') ? opt.value : "中文";
            const vLang = (dir === 'me') ? opt.getAttribute('data-code') : "zh-TW";
            try {
                const res = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, target })
                });
                const data = await res.json();
                lastText = data.translatedText;
                tDiv.innerText = lastText;
                status.innerText = "準備就緒";
                speak(lastText, vLang);
            } catch (err) { status.innerText = "翻譯伺服器連線失敗"; }
        }

        function speak(t, l) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = l;
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function replay() { 
            if(lastText) speak(lastText, (dir==='me'?tSel.options[tSel.selectedIndex].getAttribute('data-code'):'zh-TW')); 
        }
        
        updateLabels();
    </script>
</body>
</html>
