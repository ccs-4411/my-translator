<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語音翻譯官</title>

    <link rel="apple-touch-icon" href="語音助理.png">
    <meta name="apple-mobile-web-app-title" content="語音翻譯官">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        .card {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h2 {
            color: #1a73e8;
            margin-top: 0;
            font-size: 1.6rem;
            cursor: pointer;
        }

        #status {
            font-size: 0.95rem;
            color: #1a73e8;
            margin-bottom: 12px;
            font-weight: bold;
            height: 1.2em;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            border: 2px solid #eee;
            font-size: 1.1rem;
            margin-bottom: 10px;
            outline: none;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin: 15px 0;
        }

        .mic-btn {
            flex: 1;
            height: 120px;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #btn-me { background: #1a73e8; }
        #btn-other { background: #34a853; }
        #btn-stop { background: #6c757d; height: 50px; font-size: 1rem; border-radius: 15px; }

        .active {
            background: #ea4335 !important;
            transform: scale(0.96);
        }

        #result-box {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 18px;
            text-align: left;
            min-height: 120px;
            box-sizing: border-box;
            margin-top: 15px;
        }

        #original {
            color: #888;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            font-size: 1rem;
            min-height: 1.5em;
        }

        #translated {
            font-size: 1.6rem;
            font-weight: bold;
            margin-top: 12px;
            color: #111;
            min-height: 1.5em;
            word-break: break-all;
        }

        .play-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .play-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #replay-btn { background: #ff9800; }
        .play-btn:active { opacity: 0.8; }
    </style>
</head>

<body>

<div class="card">
    <h2 onclick="testSpeech()">🎙️ 語音翻譯官</h2>
    <div id="status">準備就緒</div>
    
    <select id="target"></select>

    <div class="btn-group">
        <button id="btn-me" class="mic-btn" onclick="runMic('me')">
            <span>🎤</span>
            <span>我講中文</span>
        </button>
        <button id="btn-other" class="mic-btn" onclick="runMic('other')">
            <span>🎧</span>
            <span>對方講</span>
        </button>
    </div>

    <div class="btn-group" style="margin: 0;">
        <button id="btn-stop" class="mic-btn" onclick="stopMic()">⏹️ 停止聆聽</button>
    </div>

    <div id="result-box">
        <div id="original">等待說話...</div>
        <div id="translated">翻譯結果</div>
        
        <div class="play-group">
            <button id="replay-btn" class="play-btn" onclick="replayAudio()">🔊 重播翻譯</button>
        </div>
    </div>
</div>

<script>
let recognition = null;
let isProcessing = false;
let VOICES = [];
let audioUnlocked = false;

// 記錄最後一次翻譯成功的內容，供重播功能使用
let lastSpeakText = "";
let lastSpeakLang = "";

// 🗂️ 內建語言設定清單（原後端 languages.json 內容）
const LANGUAGES = [
    { name: "English", code: "en", label: "英語", voice: "en-US" },
    { name: "Japanese", code: "ja", label: "日本語", voice: "ja-JP" },
    { name: "Korean", code: "ko", label: "한국어", voice: "ko-KR" },
    { name: "Vietnamese", code: "vi", label: "Tiếng Việt", voice: "vi-VN" },
    { name: "Thai", code: "th", label: "ไทย", voice: "th-TH" }
];

// ============================
// 1. 瀏覽器語音合成（TTS）初始化
// ============================
function loadVoices() {
    return new Promise(resolve => {
        let voices = speechSynthesis.getVoices();
        if (voices.length) return resolve(voices);
        speechSynthesis.onvoiceschanged = () => resolve(speechSynthesis.getVoices());
    });
}

async function initSpeech() {
    VOICES = await loadVoices();
}

// 貼心設計：使用者只要點擊網頁任何地方，即刻解鎖 iOS/Safari 的音訊播放限制
document.body.addEventListener("click", () => {
    if (!audioUnlocked) {
        speechSynthesis.speak(new SpeechSynthesisUtterance(""));
        audioUnlocked = true;
    }
}, { once: true });

// ============================
// 2. 初始化選單與儲存機制
// ============================
function initLangs() {
    const sel = document.getElementById("target");
    sel.innerHTML = "";
    
    LANGUAGES.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l.name;
        opt.textContent = `${l.name} ${l.label}`;
        opt.dataset.v = l.voice;
        opt.dataset.code = l.code;
        sel.appendChild(opt);
    });

    // 從本地瀏覽器讀取上次選擇的語言
    const saved = localStorage.getItem("targetLang");
    if (saved) sel.value = saved;
    sync();
}

function sync() {
    const sel = document.getElementById("target");
    localStorage.setItem("targetLang", sel.value);
}
document.getElementById("target").addEventListener("change", sync);

// ============================
// 3. 瀏覽器原生語音辨識（STT）
// ============================
function initRecognition() {
    const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
    if (!Speech) {
        document.getElementById("status").innerText = "不支援語音功能";
        return;
    }
    
    recognition = new Speech();
    recognition.continuous = false; // 採用單次辨識，講完一句話自動切入翻譯

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById("original").innerText = text;
        handleTranslation(text); // 辨識成功，直接送去翻譯
    };

    recognition.onerror = (e) => {
        console.error("語音辨識錯誤:", e.error);
        if (e.error === "service-not-allowed" || e.error === "language-not-supported") {
            document.getElementById("status").innerText = "⚠️ 瀏覽器不支援此語音輸入";
        } else if (e.error === "no-speech") {
            document.getElementById("status").innerText = "⚠️ 沒有聽到聲音";
        } else {
            document.getElementById("status").innerText = "⚠️ 語音辨識失敗";
        }
        resetUI();
    };
    recognition.onend = resetUI;
}

// ============================
// 4. 控制麥克風啟動
// ============================
function runMic(mode) {
    if (isProcessing) return;
    speechSynthesis.cancel(); // 唱歌說話中途打斷
    if (!recognition) initRecognition();

    const sel = document.getElementById("target");
    const selectedOpt = sel.selectedOptions[0];
    const isMe = (mode === "me");

    // 設定辨識語系：我講話就用台灣繁中，對方講話就切換為選單內指定的語音代碼
    recognition.lang = isMe ? "zh-TW" : selectedOpt.dataset.v;

    // 更新 UI 按鈕高亮狀態
    document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(isMe ? "btn-me" : "btn-other").classList.add("active");

    try { recognition.abort(); } catch(e) {}

    setTimeout(() => {
        try {
            recognition.start();
            document.getElementById("status").innerText = "🎤 聆聽中...請說話";
        } catch(err) {
            document.getElementById("status").innerText = "⚠️ 無法啟動麥克風";
        }
    }, 300);
}

function stopMic() {
    if (recognition) {
        try { recognition.abort(); } catch(e) {}
        document.getElementById("status").innerText = "準備就緒";
        resetUI();
    }
}

// ============================
// 5. 核心：免後端公共翻譯接口呼叫
// ============================
async function handleTranslation(text) {
    isProcessing = true;
    document.getElementById("status").innerText = "翻譯中...";

    const sel = document.getElementById("target");
    const selectedOpt = sel.selectedOptions[0];
    const targetCode = selectedOpt.dataset.code;
    const targetVoice = selectedOpt.dataset.v;
    
    // 判斷當前翻譯方向
    const isMe = (recognition.lang === "zh-TW");
    const sourceLang = isMe ? "zh-TW" : targetCode;
    const targetLang = isMe ? targetCode : "zh-TW";

    try {
        // 直連 Google 官方開放的免 Key 翻譯接口 (GTX)
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data[0]) {
            let translatedText = "";
            // 走訪陣列，將可能因為斷句而拆開的翻譯結果重新黏合
            data[0].forEach(row => {
                if(row[0]) translatedText += row[0];
            });

            document.getElementById("translated").innerText = translatedText;
            document.getElementById("status").innerText = "完成";

            // 翻譯完畢，自動播放聲音
            const playLang = isMe ? targetVoice : "zh-TW";
            speak(translatedText, playLang);
        } else {
            throw new Error("回應格式解析失敗");
        }
    } catch(err) {
        console.error(err);
        document.getElementById("translated").innerText = "⚠️ 翻譯失敗";
        document.getElementById("status").innerText = "翻譯失敗";
    }
    isProcessing = false;
}

// ============================
// 6. 語音朗讀與重播
// ============================
function speak(text, lang) {
    lastSpeakText = text;
    lastSpeakLang = lang;
    speechSynthesis.cancel(); // 清除上一次還在朗讀的尾音

    const msg = new SpeechSynthesisUtterance(text);
    const formattedLang = lang.replace('_','-'); // 標準化語系格式
    
    // 精準匹配裝置內最合適的發音人聲
    const voice = VOICES.find(v => v.lang.replace('_','-') === formattedLang)
               || VOICES.find(v => v.lang.startsWith(formattedLang.split('-')[0]));

    if (voice) msg.voice = voice;
    msg.lang = formattedLang;

    // 稍微延遲撥放，避免與麥克風關閉的系統音相撞
    setTimeout(() => { speechSynthesis.speak(msg); }, 120);
}

function replayAudio() {
    if (!lastSpeakText) {
        document.getElementById("status").innerText = "沒有可重播內容";
        return;
    }
    document.getElementById("status").innerText = "🔊 重播中...";
    speak(lastSpeakText, lastSpeakLang);
}

function resetUI() {
    document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
}

function testSpeech() { 
    speak("語音測試正常", "zh-TW"); 
}

// ============================
// 頁面加載完成自動啟動
// ============================
initSpeech();
initLangs();
initRecognition();
</script>

</body>
</html>
