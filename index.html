<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語音翻譯官</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background:#f2f4f7;
    margin:0;
    padding:15px;
    text-align:center;
}

.card {
    max-width:450px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2 {
    color:#1a73e8;
    margin-top:0;
    font-size:1.6rem;
    cursor:pointer;
}

#status {
    font-size:0.95rem;
    color:#1a73e8;
    margin-bottom:12px;
    font-weight:bold;
    height:1.2em;
}

select {
    width:100%;
    padding:14px;
    border-radius:15px;
    border:2px solid #eee;
    font-size:1.1rem;
    margin-bottom:10px;
}

.btn-group {
    display:flex;
    gap:12px;
    margin:20px 0;
}

.mic-btn {
    flex:1;
    height:120px;
    border:none;
    border-radius:25px;
    color:white;
    font-size:1.2rem;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

#btn-me {
    background:#1a73e8;
}

#btn-other {
    background:#34a853;
}

.active {
    background:#ea4335 !important;
    transform:scale(0.97);
}

#result-box {
    background:#f8f9fa;
    border-radius:20px;
    padding:18px;
    text-align:left;
    min-height:120px;
}

#original {
    color:#888;
    border-bottom:1px solid #eee;
    padding-bottom:8px;
    font-size:1rem;
}

#translated {
    font-size:1.6rem;
    font-weight:bold;
    margin-top:12px;
    color:#111;
}

/* ⭐ 重播按鈕 */
.play-group{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.play-btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:15px;
    color:white;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
}

#replay-btn{
    background:#ff9800;
}

/* ⭐ 調試信息 */
.debug-info {
    background:#fffacd;
    border-radius:10px;
    padding:10px;
    margin-top:15px;
    font-size:0.85rem;
    color:#666;
    text-align:left;
    display:none;
}

.debug-info.show {
    display:block;
}
</style>
</head>

<body>

<div class="card">

    <h2 onclick="testSpeech()">語音翻譯官</h2>

    <div id="status">準備就緒</div>

    <select id="target"></select>

    <div class="btn-group">

        <button id="btn-me"
                class="mic-btn"
                onclick="runMic('me')">

            🎤 我講中文

        </button>

        <button id="btn-other"
                class="mic-btn"
                onclick="runMic('other')">

            🎧 對方講

        </button>

    </div>

    <div id="result-box">

        <div id="original">
            等待說話...
        </div>

        <div id="translated">
            翻譯結果
        </div>

        <!-- ⭐ 重播 -->
        <div class="play-group">

            <button id="replay-btn"
                    class="play-btn"
                    onclick="replayAudio()">

                🔊 重播

            </button>

        </div>

        <!-- ⭐ 調試信息 -->
        <div class="debug-info" id="debug-info"></div>

    </div>

</div>

<script>

let recognition = null;
let isProcessing = false;
let VOICES = [];
let audioUnlocked = false;

/* ⭐ 記錄最後播放 */
let lastSpeakText = "";
let lastSpeakLang = "";

/* ⭐ 新增：檢測裝置類型 */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isAndroid = /Android/.test(navigator.userAgent);
const isMobile = isIOS || isAndroid;

/* ⭐ 語言識別代碼映射表（針對 Web Speech API） */
const RECOGNITION_LANG_MAP = {
    "zh-TW": "zh-TW",
    "zh-HK": "zh-TW",
    "en-US": "en-US",
    "en-GB": "en-GB",
    "ja-JP": "ja-JP",
    "ko-KR": "ko-KR",
    "vi-VN": "vi",        // ⭐ 越南文簡化
    "th-TH": "th",        // ⭐ 泰文簡化
    "es-ES": "es-ES",
    "fr-FR": "fr-FR",
    "de-DE": "de-DE",
    "it-IT": "it-IT",
    "cs-CZ": "cs-CZ",
    "da-DK": "da-DK",
    "fi-FI": "fi-FI",
    "sv-SE": "sv-SE",
    "id-ID": isIOS ? "en-US" : "id",  // ⭐ iOS 不支持印尼文，使用英文備用
    "pt-PT": "pt-BR",     // ⭐ 使用巴西葡文（更多手機支持）
    "pt-BR": "pt-BR",
    "tr-TR": "tr-TR",
    "ar-SA": "ar-SA"
};

/* ⭐ iOS 不支持的語言列表 */
const IOS_UNSUPPORTED_LANGS = ["id-ID", "vi-VN", "th-TH"];

// ============================
// ⭐ 調試函數
// ============================
function showDebugInfo(msg) {
    const debugEl = document.getElementById("debug-info");
    debugEl.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
    debugEl.classList.add("show");
}

function hideDebugInfo() {
    setTimeout(() => {
        document.getElementById("debug-info").classList.remove("show");
    }, 3000);
}

// ============================
// ⭐ 1. 載入語音
// ============================
function loadVoices() {

    return new Promise(resolve => {

        let voices = speechSynthesis.getVoices();

        if (voices.length) {
            return resolve(voices);
        }

        speechSynthesis.onvoiceschanged = () => {
            resolve(speechSynthesis.getVoices());
        };

    });
}

async function initSpeech() {
    VOICES = await loadVoices();
}

// ============================
// ⭐ 2. 解鎖音訊
// ============================
document.body.addEventListener("click", () => {

    if (!audioUnlocked) {

        speechSynthesis.speak(
            new SpeechSynthesisUtterance("")
        );

        audioUnlocked = true;
    }

}, { once: true });

// ============================
// ⭐ 3. 初始化語言
// ============================
async function initLangs() {

    try {

        const res =
            await fetch("/languages?v=" + Date.now());

        const langs = await res.json();

        const sel =
            document.getElementById("target");

        sel.innerHTML = "";

        langs.forEach(l => {

            const opt =
                document.createElement("option");

            opt.value = l.name;

            opt.textContent =
                `${l.name} ${l.label}`;

            opt.dataset.v = l.voice;
            opt.dataset.code = l.code;

            /* ⭐ 新增：標記不支持的語言 */
            if (isIOS && IOS_UNSUPPORTED_LANGS.includes(l.voice)) {
                opt.textContent += " ⚠️";
                opt.dataset.ios_warning = "true";
            }

            sel.appendChild(opt);

        });

        const saved =
            localStorage.getItem("targetLang");

        if (saved) {
            sel.value = saved;
        }

        sync();

    } catch(e) {

        document.getElementById("status").innerText =
            "語言載入失敗";
    }
}

function sync() {

    const sel =
        document.getElementById("target");

    localStorage.setItem(
        "targetLang",
        sel.value
    );
}

document
    .getElementById("target")
    .addEventListener("change", sync);

// ============================
// ⭐ 4. 語音辨識
// ============================
function initRecognition() {

    const Speech =
        window.webkitSpeechRecognition ||
        window.SpeechRecognition;

    if (!Speech) {

        document.getElementById("status").innerText =
            "不支援語音";

        return;
    }

    recognition = new Speech();

    recognition.continuous = false;

    recognition.onresult = (e) => {

        const text =
            e.results[0][0].transcript;

        document.getElementById("original")
            .innerText = text;

        handleTranslation(text);
    };

    // ⭐ 改良錯誤提示
    recognition.onerror = (e) => {

        console.log("語音識別錯誤:", e.error);
        showDebugInfo(`錯誤代碼: ${e.error} | 語言: ${recognition.lang}`);

        if (
            e.error === "service-not-allowed" ||
            e.error === "language-not-supported"
        ) {

            const sel = document.getElementById("target");
            const voice = sel.selectedOptions[0].dataset.v;

            if (isIOS && IOS_UNSUPPORTED_LANGS.includes(voice)) {
                document.getElementById("status").innerText =
                    "⚠️ iOS 不支持此語言的語音識別";
            } else {
                document.getElementById("status").innerText =
                    "⚠️ 此語言可能不支援語音翻譯";
            }

        } else if (e.error === "no-speech") {

            document.getElementById("status").innerText =
                "⚠️ 沒有聽到聲音，請靠近麥克風";

        } else if (e.error === "network-error") {

            document.getElementById("status").innerText =
                "⚠��� 網路連接失敗";

        } else {

            document.getElementById("status").innerText =
                "⚠️ 語音辨識失敗";
        }

        resetUI();
    };

    recognition.onend = resetUI;
}

// ============================
// ⭐ 5. 麥克風
// ============================
function runMic(mode) {

    if (isProcessing) return;

    speechSynthesis.cancel();

    if (!recognition) {
        initRecognition();
    }

    const sel =
        document.getElementById("target");

    const isMe = (mode === "me");

    /* ⭐ 改良：使用映射表 */
    let recLang = isMe ? "zh-TW" : sel.selectedOptions[0].dataset.v;
    recLang = RECOGNITION_LANG_MAP[recLang] || recLang;

    recognition.lang = recLang;

    document
        .querySelectorAll('.mic-btn')
        .forEach(b => b.classList.remove('active'));

    document
        .getElementById(
            isMe ? "btn-me" : "btn-other"
        )
        .classList.add("active");

    try {
        recognition.abort();
    } catch(e) {}

    setTimeout(() => {

        try {

            recognition.start();

            const langDisplay = isMe ? "中文" : sel.value;
            document.getElementById("status")
                .innerText = `🎤 聆聽中... (${langDisplay})`;

            /* ⭐ 調試信息 */
            showDebugInfo(`開始識別 | 語言: ${recLang} | 裝置: ${isIOS ? 'iOS' : isAndroid ? 'Android' : 'Desktop'}`);

        } catch(err) {

            document.getElementById("status")
                .innerText = "⚠️ 無法啟動語音辨識";

            showDebugInfo(`啟動失敗: ${err.message}`);
        }

    }, 300);
}

// ============================
// ⭐ 6. 翻譯
// ============================
async function handleTranslation(text) {

    isProcessing = true;

    document.getElementById("status")
        .innerText = "翻譯中...";

    const sel =
        document.getElementById("target");

    const isMe =
        (recognition.lang === "zh-TW");

    try {

        const res = await fetch("/translate", {

            method: "POST",

            headers: {
                "Content-Type":"application/json"
            },

            body: JSON.stringify({
                text,
                target: sel.value,
                mode: isMe ? "me" : "other"
            })

        });

        const data = await res.json();

        // ⭐ 防止空翻譯
        if (!data.translatedText) {

            document.getElementById("translated")
                .innerText = "⚠️ 無法翻譯";

            document.getElementById("status")
                .innerText = "翻譯失敗";

            isProcessing = false;
            return;
        }

        document.getElementById("translated")
            .innerText = data.translatedText;

        document.getElementById("status")
            .innerText = "完成";

        const playLang =
            isMe
            ? sel.selectedOptions[0].dataset.v
            : "zh-TW";

        speak(data.translatedText, playLang);

    } catch(err) {

        document.getElementById("translated")
            .innerText = "⚠️ 翻譯失敗";

        document.getElementById("status")
            .innerText = "翻譯失敗";

        showDebugInfo(`翻譯錯誤: ${err.message}`);
    }

    isProcessing = false;
}

// ============================
// ⭐ 7. 語音播放
// ============================
function speak(text, lang) {

    /* ⭐ 記住最後播放 */
    lastSpeakText = text;
    lastSpeakLang = lang;

    speechSynthesis.cancel();

    const msg =
        new SpeechSynthesisUtterance(text);

    const voice =

        VOICES.find(v =>
            v.lang.replace('_','-') === lang
        )

        ||

        VOICES.find(v =>
            v.lang.startsWith(
                lang.split('-')[0]
            )
        );

    if (voice) {
        msg.voice = voice;
    }

    msg.lang = lang;

    msg.rate = 0.9;  // ⭐ 稍微減速便於理解
    msg.pitch = 1.0;
    msg.volume = 1.0;

    setTimeout(() => {

        speechSynthesis.speak(msg);

    }, 120);
}

// ============================
// ⭐ 8. 重播
// ============================
function replayAudio() {

    if (!lastSpeakText) {

        document.getElementById("status")
            .innerText = "沒有可重播內容";

        return;
    }

    document.getElementById("status")
        .innerText = "🔊 重播中...";

    speak(lastSpeakText, lastSpeakLang);
}

// ============================
function resetUI() {

    document
        .querySelectorAll('.mic-btn')
        .forEach(b => b.classList.remove('active'));

    hideDebugInfo();
}

// ============================
function testSpeech() {

    speak("語音正常", "zh-TW");
    showDebugInfo(`TTS 測試 | 語言: zh-TW | 裝置: ${isIOS ? 'iOS' : isAndroid ? 'Android' : 'Desktop'}`);
}

// ============================
// INIT
// ============================
console.log("=== 語音翻譯官 初始化 ===");
console.log("裝置類型:", { isIOS, isAndroid, isMobile });
console.log("語言映射表:", RECOGNITION_LANG_MAP);

initSpeech();
initLangs();
initRecognition();

</script>

</body>
</html>
