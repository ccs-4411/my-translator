<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 雙向語音翻譯官</title>
    <style>
        :root { --primary: #4A90E2; --secondary: #34A853; --bg: #f2f4f7; }
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; text-align: center; background-color: var(--bg); padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        h2 { color: #202124; font-size: 1.4rem; margin-top: 0; }
        #status { color: #5f6368; font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; min-height: 1.2rem; }

        /* 語系選擇器 */
        .setup-box { margin-bottom: 20px; }
        select { width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #eee; font-size: 1.1rem; background: #fff; text-align: center; outline: none; }

        /* 翻譯方向切換 */
        .mode-selector { display: flex; gap: 12px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 15px; border: 2px solid #eee; border-radius: 18px; background: white; cursor: pointer; font-weight: bold; transition: 0.3s; line-height: 1.5; font-size: 0.95rem; }
        .mode-btn.active-me { border-color: var(--primary); background: #eef6ff; color: var(--primary); box-shadow: 0 4px 12px rgba(74,144,226,0.1); }
        .mode-btn.active-other { border-color: var(--secondary); background: #e6f4ea; color: var(--secondary); box-shadow: 0 4px 12px rgba(52,168,83,0.1); }

        /* 麥克風按鈕 */
        #micBtn {
            background-color: var(--primary); color: white; border: none; padding: 25px;
            border-radius: 50%; font-size: 2.8rem; cursor: pointer; width: 110px; height: 110px;
            margin: 10px 0; box-shadow: 0 8px 25px rgba(0,0,0,0.15); transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #micBtn.recording { background-color: #ea4335; animation: pulse 1.2s infinite; }
        
        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.08); } 
            100% { transform: scale(1); } 
        }

        /* 結果顯示區 */
        #result-box { margin-top: 15px; min-height: 160px; background: #f8f9fa; border-radius: 20px; padding: 20px; border: 1px solid #eee; text-align: left; }
        #original-text { color: #888; font-size: 0.95rem; border-bottom: 1px dashed #ddd; padding-bottom: 10px; margin-bottom: 10px; min-height: 1.2rem; }
        #translated-text { font-size: 1.8rem; color: #202124; margin: 10px 0; font-weight: bold; line-height: 1.3; min-height: 2.4rem; word-break: break-word; }

        .play-btn { background: #fff; border: 1px solid #ddd; padding: 10px 25px; border-radius: 25px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 10px; display: block; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI 語音翻譯官</h2>
    <div id="status">準備就緒</div>

    <div class="setup-box">
        <select id="targetLang" onchange="updateLabels()">
            <option value="英文" data-code="en-US">英文 English 🇺🇸</option>
            <option value="日文" data-code="ja-JP" selected>日文 日本語 🇯🇵</option>
            <option value="韓文" data-code="ko-KR">韓文 한국어 🇰🇷</option>
            <option value="法文" data-code="fr-FR">法文 Français 🇫🇷</option>
            <option value="德文" data-code="de-DE">德文 Deutsch 🇩🇪</option>
            <option value="俄文" data-code="ru-RU">俄文 Русский 🇷🇺</option>
            <option value="印尼文" data-code="id-ID">印尼文 Bahasa 🇮🇩</option>
            <option value="泰文" data-code="th-TH">泰文 ภาษาไทย 🇹🇭</option>
            <option value="西班牙文" data-code="es-ES">西班牙文 🇪🇸</option>
        </select>
    </div>

    <div class="mode-selector">
        <button id="btn-me" class="mode-btn active-me" onclick="setDirection('me')">
            我說中文<br>➔ <span class="lang-label">日文</span>
        </button>
        <button id="btn-other" class="mode-btn" onclick="setDirection('other')">
            對方說<span class="lang-label">日文</span><br>➔ 中文
        </button>
    </div>

    <button id="micBtn">🎤</button>

    <div id="result-box">
        <div id="original-text">等待語音...</div>
        <div id="translated-text">...</div>
        <button class="play-btn" onclick="replayVoice()">🔊 重播翻譯結果</button>
    </div>
</div>

<script>
    let currentDir = 'me';
    let lastTranslatedText = "";
    let recognition;

    const micBtn = document.getElementById('micBtn');
    const status = document.getElementById('status');
    const translatedDiv = document.getElementById('translated-text');
    const originalDiv = document.getElementById('original-text');
    const targetSelect = document.getElementById('targetLang');

    // 初始化語音辨識
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => { 
            micBtn.classList.add('recording'); 
            status.innerText = "正在聆聽..."; 
        };
        
        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            originalDiv.innerText = text;
            processTranslation(text);
        };
        
        recognition.onerror = (e) => { 
            status.innerText = "收音錯誤: " + e.error; 
            micBtn.classList.remove('recording'); 
        };
        
        recognition.onend = () => { 
            micBtn.classList.remove('recording'); 
        };
    } else {
        status.innerText = "瀏覽器不支援語音辨識";
    }

    function updateLabels() {
        const langName = targetSelect.value;
        document.querySelectorAll('.lang-label').forEach(el => el.innerText = langName);
        setDirection(currentDir);
    }

    function setDirection(dir) {
        currentDir = dir;
        const selectedOption = targetSelect.options[targetSelect.selectedIndex];
        const otherLangCode = selectedOption.getAttribute('data-code');

        document.getElementById('btn-me').className = 'mode-btn' + (dir === 'me' ? ' active-me' : '');
        document.getElementById('btn-other').className = 'mode-btn' + (dir === 'other' ? ' active-other' : '');

        // 設定收音語言
        if(recognition) {
            recognition.lang = (dir === 'me') ? 'zh-TW' : otherLangCode;
        }
        
        micBtn.style.backgroundColor = (dir === 'me') ? "#4A90E2" : "#34A853";
        status.innerText = "方向：切換完成";
    }

    // 點擊麥克風按鈕
    micBtn.onclick = () => {
        // iPhone 必備：藉由點擊動作解鎖語音播放權限
        window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
        
        if (micBtn.classList.contains('recording')) {
            recognition.stop();
        } else {
            try {
                recognition.start();
            } catch (e) {
                recognition.stop();
            }
        }
    };

    async function processTranslation(text) {
        status.innerText = "AI 正在翻譯...";
        const selectedOption = targetSelect.options[targetSelect.selectedIndex];
        const langName = selectedOption.value;
        const langCode = selectedOption.getAttribute('data-code');

        try {
            const response = await fetch('/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: text, 
                    target: langName, 
                    mode: currentDir 
                })
            });
            const data = await response.json();
            
            if(data.error) {
                status.innerText = "翻譯錯誤";
                translatedDiv.innerText = data.error;
                return;
            }

            lastTranslatedText = data.translatedText;
            translatedDiv.innerText = lastTranslatedText;
            status.innerText = "準備就緒";

            // 判斷發音語系
            const voiceLang = (currentDir === 'me') ? langCode : "zh-TW";
            speak(lastTranslatedText, voiceLang);
        } catch (err) {
            status.innerText = "伺服器連線失敗";
            translatedDiv.innerText = "請檢查伺服器是否正常運作";
        }
    }

    function speak(text, langCode) {
        // 先停止之前的聲音
        window.speechSynthesis.cancel();
        
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = langCode;
        utter.rate = 0.95; // 稍微慢一點讓發音更清晰
        window.speechSynthesis.speak(utter);
    }

    function replayVoice() {
        if (!lastTranslatedText) return;
        const selectedOption = targetSelect.options[targetSelect.selectedIndex];
        const voiceLang = (currentDir === 'me') ? selectedOption.getAttribute('data-code') : "zh-TW";
        speak(lastTranslatedText, voiceLang);
    }

    // 初始化標籤顯示
    updateLabels();
</script>

</body>
</html>
