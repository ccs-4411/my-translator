<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 雙向翻譯官</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 15px; }
        .card { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid #ddd; font-size: 1rem; }
        .btn-group { display: flex; gap: 15px; justify-content: center; margin: 20px 0; }
        .mic-btn { flex: 1; height: 100px; border-radius: 20px; border: none; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; transition: 0.3s; }
        #btn-me { background: #4A90E2; }
        #btn-other { background: #34A853; }
        .mic-btn.active { background: #ff4757 !important; animation: pulse 1.2s infinite; }
        .mic-icon { font-size: 2rem; margin-bottom: 5px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #result-box { background: #fdfdfd; border-radius: 15px; padding: 15px; border: 1px solid #eee; margin-top: 15px; min-height: 120px; }
        #translated { font-size: 1.8rem; font-weight: bold; color: #333; margin: 10px 0; }
        #original { color: #999; font-size: 0.9rem; }
        #status { font-size: 0.8rem; color: #4A90E2; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="status">準備就緒</div>
        <select id="engine">
            <option value="gemini">AI 智慧模式</option>
            <option value="google">傳統穩定模式</option>
        </select>
        <select id="target" onchange="updateUI()">
            <option value="英文" data-v="en-US">英文 🇺🇸</option>
            <option value="日文" data-v="ja-JP">日文 🇯🇵</option>
            <option value="韓文" data-v="ko-KR">韓文 🇰🇷</option>
            <option value="法文" data-v="fr-FR">法文 🇫🇷</option>
        </select>

        <div class="btn-group">
            <button id="btn-me" class="mic-btn" onclick="startRecognition('me')">
                <span class="mic-icon">🎤</span>
                <span>我講中文</span>
            </button>
            <button id="btn-other" class="mic-btn" onclick="startRecognition('other')">
                <span class="mic-icon">🎧</span>
                <span>對方講<span class="lang-text">英文</span></span>
            </button>
        </div>

        <div id="result-box">
            <div id="original">請按按鈕開始...</div>
            <div id="translated">...</div>
        </div>
    </div>

    <script>
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        let currentMode = 'me';
        let lastResult = "";

        function updateUI() {
            document.querySelectorAll('.lang-text').forEach(el => el.innerText = document.getElementById('target').value);
        }

        recognition.onstart = () => {
            const btnId = currentMode === 'me' ? 'btn-me' : 'btn-other';
            document.getElementById(btnId).classList.add('active');
            document.getElementById('status').innerText = "正在聆聽中...";
        };

        recognition.onend = () => {
            document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
        };

        recognition.onresult = async (e) => {
            const text = e.results[0][0].transcript;
            document.getElementById('original').innerText = text;
            doTranslate(text);
        };

        async function doTranslate(text) {
            document.getElementById('status').innerText = "翻譯中...";
            const target = document.getElementById('target');
            const engine = document.getElementById('engine').value;

            try {
                const res = await fetch('/translate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text, target: target.value, engine, mode: currentMode })
                });
                const data = await res.json();
                lastResult = data.translatedText;
                document.getElementById('translated').innerText = lastResult;
                document.getElementById('status').innerText = "翻譯完成";

                // 發音邏輯：我講中文 -> 播外語；對方講外語 -> 播中文
                const voiceCode = currentMode === 'me' ? target.options[target.selectedIndex].getAttribute('data-v') : 'zh-TW';
                speak(lastResult, voiceCode);
            } catch (err) {
                document.getElementById('status').innerText = "連線失敗";
            }
        }

        function speak(text, code) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = code;
            // 解決 iOS 英文沒聲音的加強：
            if(code.startsWith('en')) msg.rate = 0.9; 
            window.speechSynthesis.speak(msg);
        }

        function startRecognition(mode) {
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); // 預熱 iOS
            currentMode = mode;
            const target = document.getElementById('target');
            // 設定聽什麼語言
            recognition.lang = (mode === 'me') ? 'zh-TW' : target.options[target.selectedIndex].getAttribute('data-v');
            recognition.start();
        }
        
        updateUI();
    </script>
</body>
</html>
