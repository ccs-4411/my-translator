<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 翻譯官</title>

<style>
body { font-family: sans-serif; background:#f2f4f7; margin:0; padding:15px; }
.card { max-width:450px; margin:auto; background:#fff; padding:20px; border-radius:20px; }

select, button { width:100%; padding:12px; margin:5px 0; border-radius:10px; border:1px solid #ddd; }

#result { margin-top:15px; padding:15px; background:#f8f9fa; border-radius:10px; }

.lang-item { padding:10px; border-bottom:1px solid #eee; cursor:pointer; }
.lang-item:hover { background:#f0f0f0; }

#modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); }
.modal-body { background:#fff; margin:10% auto; width:80%; padding:20px; border-radius:15px; }
</style>
</head>

<body>

<div class="card">
<h2>語音翻譯</h2>

<select id="target"></select>
<button onclick="toggleModal(true)">選擇語言</button>

<button onclick="runMic('me')">🎤 我講</button>
<button onclick="runMic('other')">🎧 對方講</button>

<div id="result">
<div id="original"></div>
<div id="translated"></div>
</div>
</div>

<div id="modal" onclick="toggleModal(false)">
<div class="modal-body" onclick="event.stopPropagation()">
<input id="search" placeholder="搜尋語言...">
<div id="lang-list"></div>
</div>
</div>

<script>
let LANGS = [];

async function loadLanguages() {
    const res = await fetch("/languages");
    LANGS = await res.json();

    const sel = document.getElementById("target");
    sel.innerHTML = "";

    LANGS.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l.name;
        opt.textContent = l.name + " " + l.label;
        opt.dataset.v = l.voice;
        sel.appendChild(opt);
    });

    renderLangList();
}

function renderLangList(filter="") {
    const list = document.getElementById("lang-list");
    list.innerHTML = "";

    LANGS.filter(l => l.name.includes(filter))
    .forEach(l => {
        const div = document.createElement("div");
        div.className = "lang-item";
        div.innerText = l.label + " " + l.name;
        div.onclick = () => selectLang(l.name);
        list.appendChild(div);
    });
}

document.getElementById("search").oninput = e => {
    renderLangList(e.target.value);
};

function selectLang(name) {
    document.getElementById("target").value = name;
    localStorage.setItem("lang", name);
    toggleModal(false);
}

function toggleModal(show) {
    document.getElementById("modal").style.display = show ? "block" : "none";
}

const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

function runMic(mode) {
    const sel = document.getElementById("target");
    recognition.lang = mode === "me" ? "zh-TW" : sel.selectedOptions[0].dataset.v;

    recognition.start();

    recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById("original").innerText = text;

        const res = await fetch("/", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({text, target:sel.value, mode})
        });

        const data = await res.json();
        document.getElementById("translated").innerText = data.translatedText;

        speak(data.translatedText, sel.selectedOptions[0].dataset.v);
    };
}

function speak(text, lang) {
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = lang;
    speechSynthesis.speak(msg);
}

loadLanguages();
</script>

</body>
</html>
