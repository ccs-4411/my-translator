<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI OCR 相機翻譯</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
    margin:0;
    padding:15px;
    background:#f2f4f7;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    text-align:center;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    border-radius:30px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2{
    color:#1a73e8;
    margin-top:0;
}

#status{
    color:#1a73e8;
    font-weight:bold;
    margin-bottom:15px;
    min-height:1.2em;
}

video{
    width:100%;
    border-radius:20px;
    background:black;
}

canvas{
    display:none;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    flex:1;
    border:none;
    border-radius:15px;
    padding:15px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

#scanBtn{
    background:#1a73e8;
}

#speakBtn{
    background:#34a853;
}

#stopBtn{
    background:#ea4335;
}

select{
    width:100%;
    padding:14px;
    border-radius:15px;
    border:2px solid #eee;
    font-size:1rem;
    margin-bottom:15px;
}

.result-box{
    margin-top:20px;
    background:#f8f9fa;
    border-radius:20px;
    padding:15px;
    text-align:left;
}

.label{
    color:#888;
    font-size:0.9rem;
    margin-bottom:5px;
}

#ocrText{
    min-height:60px;
    white-space:pre-wrap;
    font-size:1rem;
}

#translatedText{
    margin-top:10px;
    font-size:1.5rem;
    font-weight:bold;
    color:#111;
    white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="card">

    <h2>📷 AI OCR 相機翻譯</h2>

    <div id="status">
        啟動中...
    </div>

    <select id="targetLang">

        <option value="英文">英文 English</option>
        <option value="日文">日文 日本語</option>
        <option value="韓文">韓文 한국어</option>
        <option value="越南文">越南文</option>
        <option value="泰文">泰文</option>

    </select>

    <video
        id="video"
        autoplay
        playsinline
    ></video>

    <canvas id="canvas"></canvas>

    <div class="controls">

        <button id="scanBtn">
            📸 掃描翻譯
        </button>

        <button id="speakBtn">
            🔊 念出翻譯
        </button>

        <button id="stopBtn">
            ⛔ 停止
        </button>

    </div>

    <div class="result-box">

        <div class="label">
            OCR 辨識結果
        </div>

        <div id="ocrText">
            等待掃描...
        </div>

        <hr>

        <div class="label">
            翻譯結果
        </div>

        <div id="translatedText">
            尚未翻譯
        </div>

    </div>

</div>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const statusDiv =
    document.getElementById("status");

const ocrTextDiv =
    document.getElementById("ocrText");

const translatedDiv =
    document.getElementById("translatedText");

let lastTranslated = "";
let isScanning = false;

// ========================
// 啟動相機
// ========================
async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"environment"
                },

                audio:false

            });

        video.srcObject = stream;

        statusDiv.innerText =
            "📷 相機已啟動";

    }catch(err){

        console.error(err);

        statusDiv.innerText =
            "⚠️ 無法開啟相機";
    }
}

// ========================
// 擷取畫面
// ========================
function captureFrame(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas;
}

// ========================
// OCR 掃描
// ========================
async function scanText(){

    if(isScanning) return;

    isScanning = true;

    translatedDiv.innerText = "";
    ocrTextDiv.innerText = "";

    statusDiv.innerText =
        "🔍 OCR 辨識中...";

    try{

        const image =
            captureFrame();

        const result =
            await Tesseract.recognize(

                image,

                "chi_tra+jpn+eng+kor",

                {
                    logger:m=>{

                        if(m.status==="recognizing text"){

                            statusDiv.innerText =
                                `🔍 OCR 辨識中 ${Math.floor(m.progress*100)}%`;
                        }
                    }
                }
            );

        const text =
            result.data.text.trim();

        if(!text){

            ocrTextDiv.innerText =
                "⚠️ 沒有辨識到文字";

            statusDiv.innerText =
                "完成";

            isScanning = false;
            return;
        }

        ocrTextDiv.innerText = text;

        statusDiv.innerText =
            "🌐 翻譯中...";

        await translateText(text);

    }catch(err){

        console.error(err);

        statusDiv.innerText =
            "⚠️ OCR 失敗";

    }

    isScanning = false;
}

// ========================
// 翻譯
// ========================
async function translateText(text){

    try{

        const target =
            document.getElementById("targetLang").value;

        const res =
            await fetch("/translate",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    text:text,
                    target:target,
                    mode:"other"

                })

            });

        const data =
            await res.json();

        if(!data.translatedText){

            translatedDiv.innerText =
                "⚠️ 翻譯失敗";

            statusDiv.innerText =
                "翻譯失敗";

            return;
        }

        translatedDiv.innerText =
            data.translatedText;

        lastTranslated =
            data.translatedText;

        statusDiv.innerText =
            "✅ 完成";

    }catch(err){

        console.error(err);

        translatedDiv.innerText =
            "⚠️ 翻譯失敗";

        statusDiv.innerText =
            "翻譯失敗";
    }
}

// ========================
// 語音播放
// ========================
function speakText(){

    if(!lastTranslated){

        statusDiv.innerText =
            "沒有可播放內容";

        return;
    }

    speechSynthesis.cancel();

    const msg =
        new SpeechSynthesisUtterance(
            lastTranslated
        );

    msg.lang = "zh-TW";

    setTimeout(()=>{

        speechSynthesis.speak(msg);

    },120);
}

// ========================
// 停止播放
// ========================
function stopSpeak(){

    speechSynthesis.cancel();

    statusDiv.innerText =
        "⛔ 已停止";
}

// ========================
// 按鈕
// ========================
document
    .getElementById("scanBtn")
    .addEventListener("click",scanText);

document
    .getElementById("speakBtn")
    .addEventListener("click",speakText);

document
    .getElementById("stopBtn")
    .addEventListener("click",stopSpeak);

// ========================
// 初始化
// ========================
startCamera();

</script>

</body>
</html>
