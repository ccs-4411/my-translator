<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI 翻譯官</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#1a73e8">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f2f4f7;
    margin:0;
    padding:15px;
    text-align:center;
}

.card{
    max-width:520px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2{
    color:#1a73e8;
    margin-top:0;
}

.top-menu{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.top-menu button{
    flex:1;
    border:none;
    border-radius:15px;
    padding:14px;
    background:#1a73e8;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#status{
    font-size:0.95rem;
    color:#1a73e8;
    margin-bottom:12px;
    font-weight:bold;
    min-height:1.2em;
}

select{
    width:100%;
    padding:14px;
    border-radius:15px;
    border:2px solid #eee;
    font-size:1rem;
    margin-bottom:10px;
}

.btn-group{
    display:flex;
    gap:12px;
    margin:20px 0;
}

.mic-btn{
    flex:1;
    height:120px;
    border:none;
    border-radius:25px;
    color:white;
    font-size:1.2rem;
    cursor:pointer;
    font-weight:bold;
}

#btn-me{
    background:#1a73e8;
}

#btn-other{
    background:#34a853;
}

.active{
    background:#ea4335 !important;
    transform:scale(0.97);
}

#result-box{
    background:#f8f9fa;
    border-radius:20px;
    padding:18px;
    text-align:left;
    min-height:120px;
}

#original{
    color:#888;
    border-bottom:1px solid #eee;
    padding-bottom:8px;
    font-size:1rem;
    white-space:pre-wrap;
}

#translated{
    font-size:1.6rem;
    font-weight:bold;
    margin-top:12px;
    color:#111;
    white-space:pre-wrap;
}

.play-group{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.play-btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:15px;
    color:white;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
}

#replay-btn{
    background:#ff9800;
}

#ocrPage{
    display:none;
}

video{

    width:100%;
    max-height:320px;
    object-fit:cover;

    border-radius:20px;
    background:black;
    margin-top:10px;
}

canvas{
    display:none;
}

.ocr-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.ocr-buttons button{
    flex:1;
    border:none;
    border-radius:15px;
    padding:14px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#cameraBtn{
    background:#1a73e8;
}

#scanBtn{
    background:#34a853;
}

#ocrSpeakBtn{
    background:#ff9800;
}

#stopBtn{
    background:#ea4335;
}

#ocr-result-box{

    background:#f8f9fa;
    border-radius:20px;
    padding:15px;
    margin-top:15px;
    text-align:left;

}

#ocrOriginal{

    color:#666;
    border-bottom:1px solid #ddd;
    padding-bottom:10px;
    white-space:pre-wrap;
    font-size:0.95rem;

}

#ocrTranslated{

    margin-top:12px;
    font-size:1.5rem;
    font-weight:bold;
    white-space:pre-wrap;

}

.tip{
    margin-top:10px;
    color:#777;
    font-size:0.85rem;
}

</style>

</head>

<body>

<div class="card">

    <h2>AI 翻譯官</h2>

    <div class="top-menu">

        <button onclick="showVoicePage()">
            🎤 語音翻譯
        </button>

        <button onclick="showOCRPage()">
            📷 掃描翻譯
        </button>

    </div>

    <div id="status">
        準備就緒
    </div>

    <!-- 語音翻譯 -->
    <div id="voicePage">

        <select id="target"></select>

        <div class="btn-group">

            <button id="btn-me"
                    class="mic-btn"
                    onclick="runMic('me')">

                🎤 我講中文

            </button>

            <button id="btn-other"
                    class="mic-btn"
                    onclick="runMic('other')">

                🎧 對方講

            </button>

        </div>

        <div id="result-box">

            <div id="original">
                等待說話...
            </div>

            <div id="translated">
                翻譯結果
            </div>

            <div class="play-group">

                <button id="replay-btn"
                        class="play-btn"
                        onclick="replayAudio()">

                    🔊 重播

                </button>

            </div>

        </div>

    </div>

    <!-- OCR -->
    <div id="ocrPage">

        <video id="video"
               autoplay
               playsinline></video>

        <canvas id="canvas"></canvas>

        <div class="ocr-buttons">

            <button id="cameraBtn">
                📷 開啟相機
            </button>

            <button id="scanBtn">
                🔍 掃描
            </button>

        </div>

        <div class="ocr-buttons">

            <button id="ocrSpeakBtn">
                🔊 念出翻譯
            </button>

            <button id="stopBtn">
                ⛔ 停止
            </button>

        </div>

        <!-- OCR 結果 -->

        <div id="ocr-result-box">

            <div id="ocrOriginal">

                掃描文字會顯示在這裡

            </div>

            <div id="ocrTranslated">

                翻譯結果

            </div>

        </div>

        <div class="tip">
            建議 HTTPS 才能使用相機
        </div>

    </div>

</div>

<script>

// =====================
// 全域
// =====================

let recognition = null;
let VOICES = [];

let lastSpeakText = "";
let lastSpeakLang = "zh-TW";

let currentStream = null;

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

// =====================
// Service Worker
// =====================

if('serviceWorker' in navigator){

    navigator.serviceWorker
    .register('/sw.js')

    .then(()=>{

        console.log("SW OK");

    })

    .catch(err=>{

        console.log(err);

    });
}

// =====================
// 模式切換
// =====================

function showVoicePage(){

    document.getElementById("voicePage")
        .style.display = "block";

    document.getElementById("ocrPage")
        .style.display = "none";
}

function showOCRPage(){

    document.getElementById("voicePage")
        .style.display = "none";

    document.getElementById("ocrPage")
        .style.display = "block";
}

// =====================
// 語音
// =====================

function loadVoices(){

    return new Promise(resolve=>{

        let voices =
            speechSynthesis.getVoices();

        if(voices.length){
            return resolve(voices);
        }

        speechSynthesis.onvoiceschanged=()=>{

            resolve(
                speechSynthesis.getVoices()
            );
        };

    });
}

async function initSpeech(){

    VOICES = await loadVoices();
}

// =====================
// 語言
// =====================

async function initLangs(){

    try{

        const res =
            await fetch("/languages");

        const langs =
            await res.json();

        const sel =
            document.getElementById("target");

        langs.forEach(l=>{

            const opt =
                document.createElement("option");

            opt.value = l.name;

            opt.textContent =
                `${l.name} ${l.label}`;

            opt.dataset.v = l.voice;

            sel.appendChild(opt);

        });

    }catch(err){

        console.log(err);
    }
}

// =====================
// 語音辨識
// =====================

function initRecognition(){

    const Speech =
        window.webkitSpeechRecognition ||
        window.SpeechRecognition;

    if(!Speech){

        alert("不支援語音辨識");
        return;
    }

    recognition = new Speech();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.onresult = (e)=>{

        const text =
            e.results[0][0].transcript;

        document.getElementById("original")
            .innerText = text;

        handleTranslation(text);
    };
}

// =====================
// 麥克風
// =====================

function runMic(mode){

    if(!recognition){
        initRecognition();
    }

    const sel =
        document.getElementById("target");

    recognition.lang =
        mode === "me"
        ? "zh-TW"
        : sel.selectedOptions[0].dataset.v;

    recognition.start();

    document.getElementById("status")
        .innerText = "🎤 聆聽中...";
}

// =====================
// 翻譯
// =====================

async function handleTranslation(text){

    document.getElementById("status")
        .innerText = "翻譯中...";

    const sel =
        document.getElementById("target");

    const mode =
        recognition.lang === "zh-TW"
        ? "me"
        : "other";

    try{

        const res =
            await fetch("/translate",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    text:text,
                    target:sel.value,
                    mode:mode

                })

            });

        const data =
            await res.json();

        document.getElementById("translated")
            .innerText = data.translatedText;

        const playLang =
            mode === "me"
            ? sel.selectedOptions[0].dataset.v
            : "zh-TW";

        speak(
            data.translatedText,
            playLang
        );

        document.getElementById("status")
            .innerText = "完成";

    }catch(err){

        document.getElementById("status")
            .innerText = "翻譯失敗";
    }
}

// =====================
// 播放
// =====================

function speak(text,lang){

    lastSpeakText = text;
    lastSpeakLang = lang;

    speechSynthesis.cancel();

    const msg =
        new SpeechSynthesisUtterance(text);

    msg.lang = lang;

    const voice =

        VOICES.find(v=>
            v.lang.replace('_','-')===lang
        )

        ||

        VOICES.find(v=>
            v.lang.startsWith(
                lang.split('-')[0]
            )
        );

    if(voice){
        msg.voice = voice;
    }

    speechSynthesis.speak(msg);
}

function replayAudio(){

    if(!lastSpeakText) return;

    speak(
        lastSpeakText,
        lastSpeakLang
    );
}

// =====================
// OCR 相機
// =====================

async function startCamera(){

    try{

        currentStream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"environment"
            }

        });

        video.srcObject = currentStream;

        document.getElementById("status")
            .innerText = "📷 相機已開啟";

    }catch(err){

        document.getElementById("status")
            .innerText = "⚠️ 相機失敗";
    }
}

function captureFrame(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0
    );

    return canvas;
}

// =====================
// OCR 掃描
// =====================

async function scanText(){

    document.getElementById("status")
        .innerText = "OCR 掃描中...";

    try{

        const image =
            captureFrame();

        const result =
            await Tesseract.recognize(

                image,

                "chi_tra+jpn+eng+kor"
            );

        const text =
            result.data.text.trim();

        document.getElementById("ocrOriginal")
            .innerText = text;

        handleOCRTranslation(text);

        // 自動關閉相機
        if(currentStream){

            currentStream
            .getTracks()
            .forEach(track=>track.stop());

        }

    }catch(err){

        document.getElementById("status")
            .innerText = "OCR 失敗";
    }
}

// =====================
// OCR 翻譯
// =====================

async function handleOCRTranslation(text){

    const sel =
        document.getElementById("target");

    try{

        const res =
            await fetch("/translate",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    text:text,
                    target:sel.value,
                    mode:"other"

                })

            });

        const data =
            await res.json();

        document.getElementById("ocrTranslated")
            .innerText = data.translatedText;

        lastSpeakText =
            data.translatedText;

        document.getElementById("status")
            .innerText = "完成";

        speak(
            data.translatedText,
            "zh-TW"
        );

    }catch(err){

        document.getElementById("status")
            .innerText = "翻譯失敗";
    }
}

// =====================
// OCR 按鈕
// =====================

document
.getElementById("cameraBtn")
.addEventListener(
    "click",
    startCamera
);

document
.getElementById("scanBtn")
.addEventListener(
    "click",
    scanText
);

document
.getElementById("ocrSpeakBtn")
.addEventListener(
    "click",
    ()=>{

        speak(
            lastSpeakText,
            "zh-TW"
        );

    }
);

document
.getElementById("stopBtn")
.addEventListener(
    "click",
    ()=>{

        speechSynthesis.cancel();

    }
);

// =====================
// INIT
// =====================

initSpeech();
initLangs();

</script>

</body>
</html>
