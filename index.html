<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>語音翻譯官</title>

<style>
body {
    font-family: -apple-system, "Microsoft JhengHei", sans-serif;
    background:#f2f4f7;
    margin:0;
    padding:15px;
    text-align:center;
}

.card {
    max-width:450px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2 { color:#1a73e8; }

#status {
    font-size:0.85rem;
    color:#888;
    margin-bottom:10px;
}

select {
    width:100%;
    padding:14px;
    border-radius:15px;
    border:2px solid #eee;
    font-size:1.1rem;
}

.btn-group {
    display:flex;
    gap:10px;
    margin:20px 0;
}

.mic-btn {
    flex:1;
    height:110px;
    border:none;
    border-radius:25px;
    color:white;
    font-size:1.1rem;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

#btn-me { background:#1a73e8; }
#btn-other { background:#34a853; }

.mic-btn.active {
    background:#ea4335 !important;
}

#result-box {
    background:#f8f9fa;
    border-radius:20px;
    padding:15px;
    text-align:left;
}

#original {
    color:#888;
    margin-bottom:8px;
    border-bottom:1px dotted #ccc;
    padding-bottom:5px;
}

#translated {
    font-size:1.5rem;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
<h2>語音翻譯官</h2>
<div id="status">準備就緒</div>

<select id="target"></select>

<div class="btn-group">
<button id="btn-me" class="mic-btn" onclick="runMic('me')">
🎤 我講中文
</button>

<button id="btn-other" class="mic-btn" onclick="runMic('other')">
🎧 對方講 <span id="target-name"></span>
</button>
</div>

<div id="result-box">
<div id="original">...</div>
<div id="translated">翻譯結果</div>
</div>
</div>

<script>
let LANGS = [];
let voices = [];

/* =========================
   🔥 iPhone 音訊解鎖
========================= */
function unlockAudio() {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
    speechSynthesis.cancel();
}
document.addEventListener("click", unlockAudio, { once: true });

/* =========================
   載入語言
========================= */
async function loadLanguages() {
    const res = await fetch("/languages");
    LANGS = await res.json();

    const sel = document.getElementById("target");
    sel.innerHTML = "";

    const groups = {};

    LANGS.forEach(l => {
        if (!groups[l.group]) groups[l.group] = [];
        groups[l.group].push(l);
    });

    for (let g in groups) {
        const optgroup = document.createElement("optgroup");
        optgroup.label = g;

        groups[g].forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.name;
            opt.textContent = `${l.name} ${l.label}`;
            opt.dataset.v = l.voice;
            optgroup.appendChild(opt);
        });

        sel.appendChild(optgroup);
    }

    updateLabel();
}

/* =========================
   更新 UI
========================= */
function updateLabel() {
    const sel = document.getElementById("target");
    document.getElementById("target-name").innerText = sel.value;
}

/* =========================
   Speech Recognition
========================= */
const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

function runMic(mode) {
    const sel = document.getElementById("target");

    recognition.lang = mode === "me"
        ? "zh-TW"
        : sel.selectedOptions[0].dataset.v;

    document.getElementById(mode === 'me' ? 'btn-me' : 'btn-other')
        .classList.add('active');

    document.getElementById("status").innerText = "🎤 聆聽中...";

    try { recognition.start(); } catch(e) { recognition.stop(); }
}

recognition.onend = () => {
    document.querySelectorAll('.mic-btn')
        .forEach(b => b.classList.remove('active'));
};

/* =========================
   翻譯 + 語音
========================= */
recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;

    document.getElementById("original").innerText = text;

    const sel = document.getElementById("target");

    fetch("/", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            text,
            target: sel.value,
            mode: (recognition.lang === "zh-TW") ? "me" : "other"
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("translated").innerText = data.translatedText;

        // 🔥 iPhone 穩定播放
        setTimeout(() => {
            speak(data.translatedText, sel.selectedOptions[0].dataset.v);
        }, 80);
    });
};

/* =========================
   🔥 修正版 Speak（穩定）
========================= */
function speak(text, lang) {
    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(text);

    msg.lang = lang;
    msg.rate = 1;

    speechSynthesis.speak(msg);
}

/* =========================
   啟動 voices（iOS 用）
========================= */
speechSynthesis.onvoiceschanged = () => {
    voices = speechSynthesis.getVoices();
};

loadLanguages();
</script>

</body>
</html>
