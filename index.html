<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>語音翻譯官 - 背包客版</title>

        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                background: #f2f4f7;
                margin: 0;
                padding: 15px;
                text-align: center;
            }

            .card {
                max-width: 450px;
                margin: auto;
                background: white;
                padding: 25px;
                border-radius: 30px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            }

            h2 {
                color: #1a73e8;
                margin-top: 0;
                font-size: 1.6rem;
                cursor: pointer;
            }

            #status {
                font-size: 0.95rem;
                color: #1a73e8;
                margin-bottom: 12px;
                font-weight: bold;
                min-height: 3em;
                padding: 8px;
                background: #f0f4fc;
                border-radius: 20px;
            }

            select {
                width: 100%;
                padding: 14px;
                border-radius: 15px;
                border: 2px solid #eee;
                font-size: 1.1rem;
                margin-bottom: 10px;
            }

            /* 模式切換按鈕 */
            .mode-switch {
                display: flex;
                gap: 12px;
                margin: 15px 0;
            }

            .mode-btn {
                flex: 1;
                padding: 14px;
                border: none;
                border-radius: 25px;
                font-size: 1rem;
                font-weight: bold;
                cursor: pointer;
                background: #e0e0e0;
                color: #555;
                transition: 0.2s;
            }

            .mode-btn.active {
                background: #1a73e8;
                color: white;
            }

            /* 偵測結果提示 */
            #detected-info {
                font-size: 0.85rem;
                color: #666;
                margin: 5px 0;
                padding: 5px;
                background: #f8f9fa;
                border-radius: 12px;
            }

            /* 單一錄音按鈕 */
            .record-btn {
                width: 100%;
                height: 140px;
                border: none;
                border-radius: 30px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                font-size: 1.5rem;
                font-weight: bold;
                cursor: pointer;
                transition: 0.2s;
                margin: 20px 0;
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            }

            .record-btn.recording {
                background: linear-gradient(135deg, #ea4335 0%, #c62828 100%);
                transform: scale(0.98);
                animation: pulse 1s infinite;
            }

            @keyframes pulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.4);
                }
                70% {
                    box-shadow: 0 0 0 15px rgba(234, 67, 53, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(234, 67, 53, 0);
                }
            }

            #result-box {
                background: #f8f9fa;
                border-radius: 20px;
                padding: 18px;
                text-align: left;
                min-height: 120px;
            }

            #original {
                color: #888;
                border-bottom: 1px solid #eee;
                padding-bottom: 8px;
                font-size: 1rem;
            }

            #translated {
                font-size: 1.6rem;
                font-weight: bold;
                margin-top: 12px;
                color: #111;
            }

            .play-group {
                display: flex;
                gap: 10px;
                margin-top: 15px;
            }

            .play-btn {
                flex: 1;
                padding: 14px;
                border: none;
                border-radius: 15px;
                color: white;
                font-size: 1rem;
                font-weight: bold;
                cursor: pointer;
            }

            #replay-btn {
                background: #ff9800;
            }
        </style>
    </head>

    <body>
        <div class="card">
            <h2 onclick="testSpeech()">🎙️ 語音翻譯官</h2>

            <div id="status">✅ 準備就緒</div>

            <select id="target"></select>

            <!-- 模式切換按鈕 -->
            <div class="mode-switch">
                <button class="mode-btn active" data-mode="me">
                    🇹🇼 我說中文
                </button>
                <button class="mode-btn" data-mode="other">
                    🌍 對方說外語
                </button>
            </div>

            <!-- 單一錄音按鈕 -->
            <button
                class="record-btn"
                id="recordBtn"
                onclick="toggleRecording()"
            >
                🎤 開始說話
            </button>

            <div id="result-box">
                <div id="original">等待說話...</div>
                <div id="detected-info">💡 選擇語言後，點擊按鈕開始翻譯</div>
                <div id="translated">翻譯結果</div>
                <div class="play-group">
                    <button
                        id="replay-btn"
                        class="play-btn"
                        onclick="replayAudio()"
                    >
                        🔊 重播
                    </button>
                </div>
            </div>
        </div>

        <script>
            let recognition = null;
            let isProcessing = false;
            let isRecording = false;
            let VOICES = [];
            let audioUnlocked = false;

            let lastSpeakText = "";
            let lastSpeakLang = "";
            
            let currentApiKey = "";
            let currentMode = "me"; // 'me' 或 'other'

            // 載入儲存的 API Key
            function loadApiKey() {
                const saved = localStorage.getItem("gemini_api_key");
                if (saved && saved.trim() !== "") {
                    currentApiKey = saved;
                    console.log("✅ API Key 已載入");
                    return true;
                }
                currentApiKey = "";
                console.log("💡 未設定 API Key，將使用 Google 翻譯");
                return false;
            }

            // ============================
            // 模式切換
            // ============================
            function initModeSwitch() {
                const modeBtns = document.querySelectorAll(".mode-btn");
                modeBtns.forEach(btn => {
                    btn.addEventListener("click", () => {
                        modeBtns.forEach(b => b.classList.remove("active"));
                        btn.classList.add("active");
                        currentMode = btn.getAttribute("data-mode");
                        
                        const targetName = document.getElementById("target").selectedOptions[0]?.textContent || "";
                        if (currentMode === "me") {
                            document.getElementById("detected-info").innerHTML = 
                                "🎤 模式：你說中文 → 翻譯成 " + targetName;
                        } else {
                            document.getElementById("detected-info").innerHTML = 
                                "🗣️ 模式：對方說外語 → 翻譯成 中文";
                        }
                    });
                });
            }

            // ============================
            // 載入語音
            // ============================
            function loadVoices() {
                return new Promise((resolve) => {
                    let voices = speechSynthesis.getVoices();
                    if (voices.length) return resolve(voices);
                    speechSynthesis.onvoiceschanged = () =>
                        resolve(speechSynthesis.getVoices());
                });
            }

            async function initSpeech() {
                VOICES = await loadVoices();
            }

            // 解鎖音訊
            document.body.addEventListener(
                "click",
                () => {
                    if (!audioUnlocked) {
                        speechSynthesis.speak(new SpeechSynthesisUtterance(""));
                        audioUnlocked = true;
                    }
                },
                { once: true },
            );

            // ============================
            // 初始化語言列表
            // ============================
            async function initLangs() {
                try {
                    const res = await fetch("/languages.json?v=" + Date.now());
                    const langs = await res.json();
                    const sel = document.getElementById("target");
                    sel.innerHTML = "";
                    langs.forEach((l) => {
                        const opt = document.createElement("option");
                        opt.value = l.name;
                        opt.textContent = `${l.name} ${l.label || ""}`;
                        opt.dataset.v = l.voice;
                        opt.dataset.code = l.code;
                        sel.appendChild(opt);
                    });
                    const saved = localStorage.getItem("targetLang");
                    if (saved) sel.value = saved;
                    sync();
                    
                    // 更新提示文字
                    const targetName = sel.selectedOptions[0]?.textContent || "";
                    if (currentMode === "me") {
                        document.getElementById("detected-info").innerHTML = 
                            "🎤 模式：你說中文 → 翻譯成 " + targetName;
                    } else {
                        document.getElementById("detected-info").innerHTML = 
                            "🗣️ 模式：對方說外語 → 翻譯成 中文";
                    }
                } catch (e) {
                    document.getElementById("status").innerText = "語言載入失敗";
                }
            }

            function sync() {
                const sel = document.getElementById("target");
                localStorage.setItem("targetLang", sel.value);
                
                // 更新提示文字
                const targetName = sel.selectedOptions[0]?.textContent || "";
                if (currentMode === "me") {
                    document.getElementById("detected-info").innerHTML = 
                        "🎤 模式：你說中文 → 翻譯成 " + targetName;
                } else {
                    document.getElementById("detected-info").innerHTML = 
                        "🗣️ 模式：對方說外語 → 翻譯成 中文";
                }
            }

            document.getElementById("target").addEventListener("change", sync);

            // ============================
            // 取得目標語言資訊
            // ============================
            function getTargetLangInfo() {
                const sel = document.getElementById("target");
                const option = sel.selectedOptions[0];
                return {
                    name: sel.value,
                    voice: option ? option.dataset.v : "en-US",
                    code: option ? option.dataset.code : "en"
                };
            }

            // ============================
            // 初始化語音辨識
            // ============================
            function initRecognition() {
                const Speech =
                    window.webkitSpeechRecognition || window.SpeechRecognition;
                if (!Speech) {
                    document.getElementById("status").innerText = "不支援語音";
                    return;
                }

                recognition = new Speech();
                recognition.continuous = false;
                recognition.interimResults = false;

                // 根據模式設定辨識語言
                if (currentMode === "me") {
                    recognition.lang = "zh-TW"; // 中文
                } else {
                    recognition.lang = ""; // 自動偵測外語
                }

                recognition.onresult = async (e) => {
                    const text = e.results[0][0].transcript;
                    const detectedLang = e.results[0][0].language || "zh-TW";

                    document.getElementById("original").innerText = text;
                    document.getElementById("status").innerHTML =
                        `🎤 辨識完成`;

                    // 執行翻譯
                    await handleTranslation(text, detectedLang);
                };

                recognition.onerror = (e) => {
                    console.log(e.error);
                    if (e.error === "no-speech") {
                        document.getElementById("status").innerHTML =
                            "⚠️ 沒有聽到聲音，請重試";
                    } else if (e.error === "network") {
                        document.getElementById("status").innerHTML =
                            "⚠️ 網路錯誤，請重試";
                    } else if (e.error === "not-allowed") {
                        document.getElementById("status").innerHTML =
                            "⚠️ 請允許麥克風權限";
                    } else {
                        document.getElementById("status").innerHTML =
                            "⚠️ 語音辨識失敗";
                    }
                    stopRecordingUI();
                };

                recognition.onend = () => {
                    stopRecordingUI();
                };
            }

            // ============================
            // 顯示引擎標記
            // ============================
            let engineBadge = null;
            function showEngineBadge(engine) {
                if (!engineBadge) {
                    engineBadge = document.createElement('div');
                    engineBadge.style.cssText = `
                        position: fixed;
                        bottom: 20px;
                        right: 20px;
                        background: rgba(0,0,0,0.75);
                        color: white;
                        padding: 6px 12px;
                        border-radius: 20px;
                        font-size: 11px;
                        z-index: 1000;
                        pointer-events: none;
                        transition: opacity 0.5s;
                        font-weight: 500;
                        backdrop-filter: blur(5px);
                    `;
                    document.body.appendChild(engineBadge);
                }
                
                const engineName = engine === 'Gemini' ? '🤖 Gemini AI' : '🌐 Google 翻譯';
                engineBadge.textContent = engineName;
                engineBadge.style.opacity = '1';
                
                setTimeout(() => {
                    engineBadge.style.opacity = '0';
                }, 2000);
            }

            // ============================
            // 翻譯處理
            // ============================
            async function handleTranslation(text, detectedLangCode) {
                if (isProcessing) return;
                isProcessing = true;

                document.getElementById("status").innerHTML = "🔄 翻譯中...";

                const targetInfo = getTargetLangInfo();
                const targetLangName = targetInfo.name;
                const targetVoice = targetInfo.voice;

                // 雲端翻譯
                try {
                    const res = await fetch("/translate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            text: text,
                            target: targetLangName,
                            mode: currentMode,
                            apiKey: currentApiKey
                        }),
                    });

                    const data = await res.json();

                    if (data.error || !data.translatedText) {
                        document.getElementById("translated").innerText =
                            data.error || "⚠️ 無法翻譯";
                        document.getElementById("status").innerHTML = "翻譯失敗";
                        isProcessing = false;
                        return;
                    }

                    document.getElementById("translated").innerText =
                        data.translatedText;
                    document.getElementById("status").innerHTML = "✅ 翻譯完成";
                    
                    if (data.engine) {
                        showEngineBadge(data.engine);
                    }

                    // 播放翻譯結果
                    const playLang = currentMode === "me" ? targetVoice : "zh-TW";
                    speak(data.translatedText, playLang);
                } catch (err) {
                    console.error(err);
                    document.getElementById("translated").innerText =
                        "⚠️ 翻譯失敗";
                    document.getElementById("status").innerHTML = "網路錯誤";
                }

                isProcessing = false;
            }

            // ============================
            // 錄音控制
            // ============================
            function toggleRecording() {
                if (isRecording) {
                    if (recognition) {
                        recognition.stop();
                    }
                    stopRecordingUI();
                } else {
                    if (!recognition) {
                        initRecognition();
                    }
                    
                    // 重新設定辨識語言
                    if (currentMode === "me") {
                        recognition.lang = "zh-TW";
                    } else {
                        recognition.lang = "";
                    }

                    document.getElementById("original").innerText = "🎙️ 聆聽中...";
                    document.getElementById("translated").innerText = "翻譯結果";
                    document.getElementById("status").innerHTML = "🎙️ 請說話...";
                    
                    const targetName = document.getElementById("target").selectedOptions[0]?.textContent || "";
                    if (currentMode === "me") {
                        document.getElementById("detected-info").innerHTML = 
                            "🎤 請說中文，將翻譯成 " + targetName;
                    } else {
                        document.getElementById("detected-info").innerHTML = 
                            "🗣️ 請說外語，將翻譯成 中文";
                    }

                    try {
                        recognition.start();
                        startRecordingUI();
                    } catch (err) {
                        console.log("啟動失敗:", err);
                        document.getElementById("status").innerHTML =
                            "⚠️ 無法啟動麥克風，請檢查權限";
                    }
                }
            }

            function startRecordingUI() {
                isRecording = true;
                const btn = document.getElementById("recordBtn");
                btn.classList.add("recording");
                btn.innerHTML = "⏹️ 停止錄音";
            }

            function stopRecordingUI() {
                isRecording = false;
                const btn = document.getElementById("recordBtn");
                btn.classList.remove("recording");
                btn.innerHTML = "🎤 開始說話";
                if (document.getElementById("status").innerHTML.includes("請說話")) {
                    document.getElementById("status").innerHTML = "✅ 準備就緒";
                }
            }

            // ============================
            // 語音播放
            // ============================
            function speak(text, lang) {
                lastSpeakText = text;
                lastSpeakLang = lang;
                speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                const voice =
                    VOICES.find((v) => v.lang.replace("_", "-") === lang) ||
                    VOICES.find((v) => v.lang.startsWith(lang.split("-")[0]));
                if (voice) msg.voice = voice;
                msg.lang = lang;
                setTimeout(() => speechSynthesis.speak(msg), 120);
            }

            function replayAudio() {
                if (!lastSpeakText) {
                    document.getElementById("status").innerHTML = "沒有可重播內容";
                    return;
                }
                document.getElementById("status").innerHTML = "🔊 重播中...";
                speak(lastSpeakText, lastSpeakLang);
            }

            function testSpeech() {
                speak("語音功能正常，請點擊按鈕開始翻譯", "zh-TW");
            }

            // ============================
            // 初始化
            // ============================
            async function init() {
                loadApiKey();
                await initSpeech();
                await initLangs();
                initModeSwitch();
                initRecognition();
            }

            init();
        </script>
    </body>
</html>
