<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語音翻譯官</title>

<style>
body { font-family: sans-serif; background:#f2f4f7; margin:0; padding:15px; text-align:center; }
.card { max-width:450px; margin:auto; background:white; padding:25px; border-radius:30px; }
h2 { color:#1a73e8; cursor:pointer; }
#status { color:#1a73e8; margin-bottom:10px; font-weight:bold; }
select { width:100%; padding:10px; border-radius:10px; margin-bottom:10px; }
.btn-group { display:flex; gap:10px; margin:15px 0; }
.mic-btn { flex:1; height:100px; border:none; border-radius:20px; color:white; font-size:1.1rem; cursor:pointer; }
#btn-me { background:#1a73e8; }
#btn-other { background:#34a853; }
.active { background:#ea4335 !important; }
#result-box { background:#f8f9fa; border-radius:20px; padding:15px; text-align:left; min-height:100px; }
#original { color:#888; }
#translated { font-size:1.4rem; font-weight:bold; margin-top:10px; }
</style>
</head>

<body>

<div class="card">
    <h2 onclick="testSpeech()">語音翻譯官</h2>
    <div id="status">準備就緒</div>

    <select id="target">
        <option value="English" data-v="en-US">English</option>
        <option value="日本語" data-v="ja-JP">日本語</option>
        <option value="韓文" data-v="ko-KR">韓文</option>
    </select>

    <div class="btn-group">
        <button id="btn-me" class="mic-btn" onclick="runMic('me')">🎤 我講中文</button>
        <button id="btn-other" class="mic-btn" onclick="runMic('other')">🎧 對方講</button>
    </div>

    <div id="result-box">
        <div id="original">等待說話...</div>
        <div id="translated">翻譯結果</div>
    </div>
</div>

<script>
let recognition = null;
let isProcessing = false;
let VOICES = [];
let audioUnlocked = false;

// =====================
// ⭐ 載入語音（關鍵修正）
// =====================
function loadVoices() {
    return new Promise(resolve => {
        let voices = speechSynthesis.getVoices();
        if (voices.length) {
            resolve(voices);
        } else {
            speechSynthesis.onvoiceschanged = () => {
                resolve(speechSynthesis.getVoices());
            };
        }
    });
}

async function initSpeech() {
    VOICES = await loadVoices();
    console.log("voices ready:", VOICES.length);
}

// =====================
// ⭐ 解鎖音訊（關鍵修正）
// =====================
document.body.addEventListener("click", () => {
    if (!audioUnlocked) {
        speechSynthesis.speak(new SpeechSynthesisUtterance(""));
        audioUnlocked = true;
        console.log("audio unlocked");
    }
}, { once: true });

// =====================
// 語音辨識
// =====================
function initRecognition() {
    const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
    if (!Speech) {
        document.getElementById("status").innerText = "不支援語音辨識";
        return;
    }

    recognition = new Speech();
    recognition.continuous = false;

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById("original").innerText = text;
        handleTranslation(text);
    };

    recognition.onerror = () => {
        document.getElementById("status").innerText = "❌ 辨識錯誤";
        resetUI();
    };

    recognition.onend = resetUI;
}

// =====================
// 麥克風
// =====================
function runMic(mode) {
    if (isProcessing) return;

    speechSynthesis.cancel(); // 避免衝突

    if (!recognition) initRecognition();

    const sel = document.getElementById("target");
    const isMe = (mode === "me");

    recognition.lang = isMe ? "zh-TW" : sel.selectedOptions[0].dataset.v;

    document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(isMe ? 'btn-me' : 'btn-other').classList.add('active');

    try { recognition.abort(); } catch(e) {}

    setTimeout(() => {
        recognition.start();
        document.getElementById("status").innerText = "🎤 聆聽中...";
    }, 300);
}

// =====================
// 假翻譯（你可以接後端）
// =====================
async function handleTranslation(text) {
    isProcessing = true;
    document.getElementById("status").innerText = "翻譯中...";

    // 模擬翻譯
    const result = text + " (翻譯)";

    document.getElementById("translated").innerText = result;

    const sel = document.getElementById("target");
    const lang = sel.selectedOptions[0].dataset.v;

    speak(result, lang);

    isProcessing = false;
}

// =====================
// ⭐ 語音播放（穩定版）
// =====================
function speak(text, lang) {
    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(text);

    const voice = VOICES.find(v => v.lang.replace('_','-') === lang) ||
                  VOICES.find(v => v.lang.startsWith(lang.split('-')[0]));

    if (voice) msg.voice = voice;

    msg.lang = lang;

    setTimeout(() => {
        speechSynthesis.speak(msg);
    }, 100);
}

// =====================
// 測試
// =====================
function testSpeech() {
    speak("語音正常", "zh-TW");
}

function resetUI() {
    document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('active'));
}

// 初始化
initSpeech();
initRecognition();
</script>

</body>
</html>
