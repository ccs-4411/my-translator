<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="/manifest.json">

<title>語音翻譯官</title>

<style>
body{font-family:sans-serif;background:#f2f4f7;text-align:center;padding:15px;}
.card{max-width:450px;margin:auto;background:white;padding:20px;border-radius:20px;}
button{padding:20px;margin:5px;border:none;border-radius:15px;color:white;}
#btn-me{background:#1a73e8;} #btn-other{background:#34a853;}
</style>

</head>
<body>

<div class="card">

<h2>語音翻譯</h2>
<div id="status">初始化...</div>

<select id="target"></select>

<div>
<button id="btn-me" onclick="runMic('me')">🎤 我講</button>
<button id="btn-other" onclick="runMic('other')">🎧 對方</button>
</div>

<div id="result">
<div id="original"></div>
<div id="translated"></div>
</div>

</div>

<script>

/* 🔥 解鎖手機音訊 */
document.addEventListener("touchstart", ()=>{
    let u=new SpeechSynthesisUtterance(" ");
    speechSynthesis.speak(u);
    speechSynthesis.cancel();
},{once:true});


/* 🔁 初始化 */
async function init(){
    try{
        await loadLangs();
        document.getElementById("status").innerText="準備就緒";
    }catch{
        setTimeout(init,1000);
    }
}
window.onload=init;


/* 🌍 語言 */
async function loadLangs(){
    const res=await fetch("/languages");
    const data=await res.json();

    const sel=document.getElementById("target");
    sel.innerHTML="";

    data.forEach(l=>{
        let o=document.createElement("option");
        o.value=l.name;
        o.textContent=l.name;
        o.dataset.v=l.voice;
        sel.appendChild(o);
    });
}


/* 🎤 語音 */
const rec=new(window.SpeechRecognition||webkitSpeechRecognition)();
let mode="me";

function runMic(m){
    mode=m;
    const sel=document.getElementById("target");

    rec.lang = m==="me"?"zh-TW":sel.selectedOptions[0].dataset.v;
    rec.start();
}


rec.onresult=async e=>{
    let text=e.results[0][0].transcript;
    document.getElementById("original").innerText=text;

    const sel=document.getElementById("target");

    try{
        let res=await fetch("/",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({text,target:sel.value,mode})
        });

        let data=await res.json();
        document.getElementById("translated").innerText=data.translatedText;

        speak(data.translatedText, sel.selectedOptions[0].dataset.v);

    }catch{
        document.getElementById("translated").innerText="網路錯誤";
    }
};


/* 🔊 TTS */
async function speak(text,lang){
    try{
        let res=await fetch("/tts",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({text,lang:lang.split("-")[0]})
        });

        let data=await res.json();

        let audio=new Audio(data.audio_url);
        setTimeout(()=>audio.play(),120);

    }catch{}
}


/* 🔥 PWA */
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/sw.js");
}

</script>

</body>
</html>
</html>
